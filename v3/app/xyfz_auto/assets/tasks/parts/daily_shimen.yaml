# -*- coding: utf-8 -*-
# ============================================================
# 师门任务(单人) —— 2026-09-09 双账号实测成功
# ------------------------------------------------------------
# 流程: 主界面 → 玩法面板(列表回顶) → OCR点「师门任务」卡片
#       → 介绍页分支:
#          新号有「请选择…师傅」→ 点师傅(程咬金 124,796 → 菩提祖师 270,796
#                                  → 空度禅师 416,796 依次兜底)
#          老号无师傅选择      → 点「前往」(271,800 = 文字框中心)
#       → 自动寻路+对话+N场战斗(战斗自动进行,无需点自动)
#       → 等「恭喜完成了今日师门任务」→ 点掉结算 → 回主界面
#
# 注意:
#   - 师门卡片在玩法面板内位置会变(完成后沉底),故用 OCR 定位点击
#   - 师门/五环是单人任务,不需要组队
#   - 介绍页「前往」按钮 OCR 识别为"前注",故用固定坐标; 取**文字框中心**
#     (271,800), 别再退回框左上角 (241,782) —— 点角上游戏判出界, 介绍页不动
#   - 全程无需点任务栏标签,游戏自动连续跑完 5 环
#   - 语法: 每步只写一个动作键; jump 为无条件跳转(分支汇合用)
# ============================================================
name: 师门任务
description: 玩法面板→师门卡片(OCR定位)→选师傅或前往→自动跑完5环→点结算

settings:
  default_timeout: 10
  default_retry: 2

steps:
  # 2026-10-23 v6.1.1: 重写进入守卫 —— 旧版按系统返回键(key:4), 实测不仅关不掉
  # 「恭喜获得」奖励结算串(日常一条龙的挖宝封妖/烧法/商旅护送等页依次弹出),
  # 反而弹「确认要退出?」系统框, 把局面彻底搞砸。实测正确关法: 点**底栏中下部任务栏区域**
  # [270,905], 每点一次翻过一页奖励, 全部翻完自动回主界面。不用左下角返回箭头
  # [27,913](可能跳到离线挂机界面), 更不用 key:4。循环(最多 8 轮)边点边判主界面。
  - name: 师门-进入守卫-循环
    loop: 8
    steps:
      - name: 师门-进入守卫-无奖励弹窗则通过
        wait: {ui: 奖励结算弹窗}
        timeout: 2
        retry: 0
        on_fail: {goto: 师门-进入守卫-完成}
      - name: 师门-进入守卫-点任务栏翻过奖励页
        click: [270, 905]
      - name: 师门-进入守卫-停顿2秒
        sleep: 2

  - name: 师门-进入守卫-完成
    sleep: 1

  # 2026-09-14 重构: 旧守卫「在队即整段跳过」太武断 —— 用户确认**队长带固定队时
  # 单人玩法可以正常做**, 只有队员才被禁; 但队长/队员无法从面板 UI 可靠区分,
  # 故废弃守卫, 改在介绍页点前往后用「页面是否关闭」行为判别(见下方前往生效检测)。
  - name: 师门-打开玩法面板
    click: [506, 539]

  - name: 等玩法面板出现
    wait: {ui: 玩法面板}
    timeout: 10
    retry: 3
    # 2026-10-09 修复: 面板打不开不能再硬往下走(后续点页签/下拉/找卡全在空转,
    # 最后被当成"已完成"跳过; 账号2 实录)。失败即进恢复块: 判面板→重开→找卡。
    on_fail: {goto: 师门-恢复-若面板已开则直接找卡}

  # 2026-09-10 新增: 确保在「日常」页签(曾点到别的页签导致 OCR 找不到卡片)
  - name: 点日常页签(确保在正确页签)
    click: [95, 934]
    on_fail: continue

  - name: 页签切换停顿
    sleep: 1

  - name: 玩法列表下拉回顶(1/2)
    swipe: {from: [270, 320], to: [270, 860], duration: 200}

  - name: 停顿1秒
    sleep: 1

  - name: 玩法列表下拉回顶(2/2)
    swipe: {from: [270, 320], to: [270, 860], duration: 200}

  - name: 停顿1秒
    sleep: 1

  # 2026-09-11 新增: 玩法面板完成判定 —— 卡片左上角「已完成」徽标与卡名
  # 中心 y 相差约 21px, 引擎 ocr_pair 按纵向相邻配对(阈值45px), 防止别家徽标误配。
  # 已完成 → 关面板直接收尾, 不再进介绍页(会弹"次数已用完"打乱流程)
  - name: 师门-若面板显示已完成则跳过
    wait: {ocr_pair: [已完成, 师门任务], pair_min_score: 0.62, pair_min_x: 250}
    timeout: 12  # v5.1.0: 单帧≈截图0.8s+全图OCR5.2s, 5s 只够判 1 帧
    retry: 0
    on_success: {goto: "师门-已完成关面板"}
    on_fail: continue

  # 2026-09-11 14:35 事故修复: 面板刚打开动画未就绪/OCR抖动会误判"未完成"
  # (13:05 已完成的师门被误判 → 重复进师门 → 死等完成弹窗60分钟终止全家桶)。
  # 停3秒后复核一次, 两次都未命中才认定未完成
  - name: 师门-徽标复核停顿
    sleep: 3

  - name: 师门-徽标复核
    wait: {ocr_pair: [已完成, 师门任务], pair_min_score: 0.62, pair_min_x: 250}
    timeout: 12  # v5.1.0: 单帧≈截图0.8s+全图OCR5.2s, 5s 只够判 1 帧
    retry: 0
    on_success: {goto: "师门-已完成关面板"}
    on_fail: continue

  # 主路径必须 jump 跳过下方关面板块(否则正常做任务时面板会被关掉)
  - name: 师门-未完成跳过守卫块
    jump: 点师门任务卡片(OCR定位)

  - name: 师门-已完成关面板
    click: [22, 916]
    on_fail: continue

  - name: 师门-已完成停顿
    sleep: 1

  - name: 师门-已完成等回主界面
    wait: {ui: 主界面}
    timeout: 10
    retry: 2
    on_fail: continue

  - name: 师门-已完成跳收尾
    jump: 师门-等回主界面

  - name: 点师门任务卡片(OCR定位)
    click: {ocr: 师门任务}
    # 2026-10-19 v5.4.0(P0-3): 8 → 12 秒(与五环同改)。单帧 OCR 1.5~5.2s,
    # 8 秒只够 1~2 帧; 横幅遮挡窗口 3~6 秒, 需要 3~5 帧才能跨过去。
    timeout: 12
    retry: 1
    # 2026-10-09 修复: 旧版直接 goto "找卡恢复-拉回顶部", 那是在**面板没开**的
    # 情况下空转(拉回顶部/再点卡片全打在主界面上), 最终 goto "已完成关面板"
    # → 师门被静默跳过。改为先经"恢复-若面板已开"判面板: 没开就先重开面板。
    #
    # 2026-10-19 v5.1.0 ⚠ 师门漏做的真凶: 卡名是**大号美术字**, 而世界播报横幅
    # ("XX 使用好心宝箱幸运获得了【…】", y≈128, 高约 19~40px) 正好横盖第一张卡
    # 「师门任务」的卡名(y108~145)。同一张画面 OCR 实测: 横幅没来时读得出
    # 师门任务(0.790), 横幅一来就**整个消失** → 点不了卡 → 整段师门零执行。
    # 所以 on_fail 先走"遮挡兜底"(等横幅走开 + 用卡面固定坐标点), 再走重开面板。
    # 兜底块放在文件末尾(非顺序流), 避免点卡成功后顺着往下再点一次。
    on_fail: {goto: 师门-找卡-遮挡兜底-面板在否}


  # 2026-09-10 新增: 该玩法离线期间已完成时, 点入口会弹
  # 「当前玩法已在离线期间完成,是否前往领取奖励?」挡住后续流程
  # → OCR 到「继续进行」就点它(奖励由领奖脚本的玩法面板宝箱统一领)
  - name: 师门-若弹离线完成提示则点继续进行
    optional: true      # 条件探测: 没这个弹窗/面板属正常, 不计入失败统计
    wait: {ocr: 继续进行}
    timeout: 6
    retry: 0
    click_center: true
    on_fail: continue
  - name: 等师门介绍页
    wait: {ocr: 任务说明}
    timeout: 8
    retry: 3
    # 2026-09-14 17:25 事故: 点卡片瞬间顶部弹系统公告横幅(藏宝图播报)吞掉点击,
    # 介绍页没开 → 本步裸奔 4 次直接终止全家桶(后面师门五环全没跑)。禁止裸奔。
    on_fail: {goto: 师门-介绍页未开-复核}

  - name: 判断是否需选师傅(新号)
    # 2026-09-11: 通用词"请选择"过宽(其他界面也可能出现), 改用介绍页实际文案子串
    wait: {ocr: 接取任务的师傅}
    timeout: 8
    on_fail: {goto: 无师傅直接点前往}

  # 2026-10-03 改造: 与五环对齐, 首选 adb 点击(另一台电脑 win 通道窗口定位偏移,
  # 点师傅无效)。保留 win 兜底: 9-10 实测师傅牌匾可能被反注入屏蔽 adb tap,
  # 点后 5s 介绍页没关 → win 通道补点一次(本机校准过, 本机可用; 位置偏的机器
  # 反正 adb 生效, 走不到这步)。
  - name: 点第一个师傅(adb,同五环)
    click: [124, 796]
    on_fail: continue

  - name: 师门-点师傅后看介绍页是否关闭
    wait: {not: {ocr: 任务说明}}
    timeout: 5
    retry: 0
    on_success: {goto: "师门-前往是否生效(介绍页应关闭)"}
    on_fail: continue

  - name: 师门-师傅win通道补点
    click: {at: [124, 796], via: win}
    on_fail: continue

  # 2026-10-19 v5.2.1 事故: 账号2 的师门介绍页是「请选择想要接取任务的师傅」版式
  # (三个师傅按钮 y≈796, 没有「前往」按钮)。实测点程咬金正中心 (124,796) 后 5s
  # 介绍页纹丝不动 → 旧流程接着去点不存在的「前往」(241,782) 空点两轮 24s 后收尾,
  # 师门整天 0/5。加换师傅兜底: 程咬金不受理就试菩提祖师/空度禅师。
  - name: 师门-换第二个师傅(菩提祖师)
    click: [270, 796]
    on_fail: continue
  - name: 师门-第二个师傅后看介绍页是否关闭
    wait: {not: {ocr: 任务说明}}
    timeout: 5
    retry: 0
    on_success: {goto: 师门等战斗}
    on_fail: continue
  - name: 师门-换第三个师傅(空度禅师)
    click: [416, 796]
    on_fail: continue
  - name: 师门-第三个师傅后看介绍页是否关闭
    wait: {not: {ocr: 任务说明}}
    timeout: 6
    retry: 0
    on_success: {goto: 师门等战斗}
    on_fail: {goto: 师门-超时收尾-关面板}

  - name: 停顿2秒
    sleep: 1

  - name: 跳到等战斗
    jump: 师门-前往是否生效(介绍页应关闭)

  # 2026-10-03: 与五环完全一致的 adb 点击(原 win 通道在窗口尺寸不同的机器上落点偏移)
  # 2026-10-19 v5.2.1: 原 (241,782) 恰好是 OCR「前注(前往)」文字框的左上角
  # (实测框 241,782 60x29), 点在角上游戏判为出界 → 介绍页不动。改点框中心 (271,800)。
  - name: 无师傅直接点前往
    click: [271, 800]
    on_fail: continue

  # 2026-09-14 新增: 队员/队长行为判别 —— 固定队**队员**点前往/师傅被游戏
  # 静默拒绝(点击无任何反应), 介绍页留在原地; **队长/无队**点前往则页面立即
  # 关闭开始寻路(09-12 事故截图实锤)。以「任务说明」是否消失判别:
  # 消失=接受, 继续等战斗; 不消失=队员被禁, 快速收尾(不白等也不误报完成)
  - name: 师门-前往是否生效(介绍页应关闭)
    wait: {not: {ocr: 任务说明}}
    timeout: 12
    retry: 0
    on_fail: {goto: 师门-前往未生效-复核}

  # 2026-10-08 加固: 12s 没生效时不再直接收尾 —— 先复核一次(页面可能慢关),
  # 真没关再补点一次「前往」(与卡片层"等横幅消失再点一次"同套路, 防点击被
  # 公告横幅/动画吞掉这种瞬时问题)。仍不关才走超时收尾(队员被禁/点击无效)。
  - name: 师门-前往未生效-复核
    wait: {not: {ocr: 任务说明}}
    timeout: 3
    retry: 0
    on_success: {goto: 师门等战斗}
    on_fail: continue

  - name: 师门-前往未生效-再点前往
    # v5.2.1: 换一个落点(中心偏下 12px)再补一次, 防点击被吞/角上偏移
    click: [271, 812]
    on_fail: continue

  - name: 师门-前往未生效-再等12秒
    wait: {not: {ocr: 任务说明}}
    timeout: 12
    retry: 0
    on_success: {goto: 师门等战斗}
    on_fail: {goto: 师门-超时收尾-关面板}

  # 2026-09-12 事故修复: 角色在练功区托管挂机时, 介绍页点师傅/「前往」都被游戏禁用,
  # 战斗永不开始 —— 旧版这里失败后顺序流入「等完成弹窗」白筹 30 分钟。
  # 改 retry 2(共270s) 仍无战斗 → 短等完成弹窗 300s 缴冲(兼容纯对话环) → 收尾。
  - name: 师门等战斗
    # 2026-09-14: 多信号(回合/自动中/逃跑), 组队/横幅遮挡时「回合」可能不可见
    wait: {any: [{ocr: 回合}, {ocr: 自动中}, {ocr: 逃跑}]}
    timeout: 90
    retry: 2
    on_fail: continue        # 若该环纯对话无战斗也不卡死

  # 2026-09-10 傍晚修复: 旧条件「今日师门任务」过宽 —— 中途环数弹窗也含这四个字,
  # 第一环结束就误判完成并点掉继续框 → 链条中断、5 环只跑 1 环还报成功
  # (真完成弹窗为「恭喜完成了今日师门任务」, 用"恭喜完成"精确匹配)
  # 2026-09-11 14:35: timeout 1200×3=60分钟太长, 改 900×2=30分钟;
  # 2026-09-12: 900×2 仍是浪费(走到这里说明等战斗已失败, 一环最多几分钟), 改 300×1
  - name: 等师门完成弹窗(最长5分钟)
    wait: {ocr: 恭喜完成}
    timeout: 300
    retry: 0
    on_fail: {goto: 师门-超时收尾-关面板}

  - name: 点掉师门结算(1/2)
    click: [450, 700]

  - name: 停顿2秒
    sleep: 1

  - name: 点掉师门结算(2/2)
    click: [450, 700]

  - name: 停顿2秒
    sleep: 1

  # 2026-09-11 新增: 「恭喜完成」可能是第1环弹窗, 点掉后2-5环还在后台自动跑
  # (上午师门 09:05 弹窗后链条自己跑完 5/5 就是证据)。
  # 若立刻退出, 后续段的开面板/点击会打断链条(11:47 五环只跑1环就死的教训)。
  # 等「主界面+无回合」连续两轮(约4分钟安静)才结束本段
  - name: 师门-链条收尾-等回主界面
    wait: {ui: 主界面}
    timeout: 60
    on_fail: continue

  # 2026-09-11 15:20 用户要求: 收尾确认由约4分钟压缩到约1分钟
  # (实测「恭喜完成」即总完成弹窗, 点掉后无后台续跑; 若复核时仍在战斗则跳回继续等)
  # 2026-09-29 再压(用户诉求 5-10s): 60 → 15 秒。后面「若仍战斗则继续等」
  # 会 OCR 回合/自动中/逃跑, 真在续跑照样跳回「等回主界面」继续盯着, 不会误判
  - name: 师门-链条收尾-停顿15秒
    sleep: 15

  - name: 师门-链条收尾-若仍战斗则继续等
    wait: {not: {any: [{ocr: 回合}, {ocr: 自动中}, {ocr: 逃跑}]}}
    timeout: 3
    retry: 0
    on_fail: {goto: "师门-链条收尾-等回主界面"}

  - name: 师门-等回主界面
    wait: {ui: 主界面}
    timeout: 30
    retry: 2
    on_fail: continue

  # ---------- 收尾验收(v3.9.0): 以玩法面板「已完成」徽标为权威 ----------
  # 2026-10-17 用户确立: 卡片挂「已完成」徽标 = 做成了(哪怕中间掉过几步);
  #   没挂徽标 = 没做成(哪怕逐步零失败) —— 数"掉了几步"只是二手猜测。
  #   验收步失败不算任务失败(探测性质), 只把该子任务的结论改为「面板未见已完成」。
  - name: 师门-验收-打开玩法面板
    click: [506, 539]
    timeout: 5
    retry: 1
    on_fail: continue

  - name: 师门-验收-等面板出现
    wait: {ui: 玩法面板}
    timeout: 8
    retry: 1
    on_fail: {goto: 师门-验收-关面板兜底}

  - name: 师门-验收-点日常页签
    click: [95, 934]
    on_fail: continue

  - name: 师门-验收-列表回顶
    swipe: {from: [270, 320], to: [270, 860], duration: 200}
    on_fail: continue

  - name: 师门-验收-回顶停顿
    sleep: 1

  - name: 师门-验收-看已完成徽标
    wait: {ocr_pair: [已完成, 师门任务], pair_min_score: 0.62, pair_min_x: 250}
    timeout: 12  # v5.1.0: 单帧≈截图0.8s+全图OCR5.2s, 5s 只够判 1 帧
    retry: 0
    verify_done: true
    on_success: {goto: 师门-验收-关面板兜底}
    on_fail: continue

  # 2026-09-11 教训复用: 面板动画未就绪/OCR抖动会误判"未完成"(曾死等60分钟),
  # 停 3 秒后复核一次, 两次都未命中才认定"面板未见已完成"
  - name: 师门-验收-复核停顿
    sleep: 3

  - name: 师门-验收-复核徽标
    wait: {ocr_pair: [已完成, 师门任务], pair_min_score: 0.62, pair_min_x: 250}
    timeout: 12  # v5.1.0: 单帧≈截图0.8s+全图OCR5.2s, 5s 只够判 1 帧
    retry: 0
    verify_done: true
    # 2026-10-18 v4.4.0: 复核步=同卡二次确认, OR 合并(检查✘→复核✔ 仍算完成)
    verify_retry: true
    on_fail: continue

  - name: 师门-验收-关面板兜底
    click: [22, 916]
    on_fail: continue

  - name: 师门-验收-等回主界面
    wait: {ui: 主界面}
    timeout: 10
    retry: 1
    on_fail: continue

  # 跳板: 主流程走到这里必须跳过下方恢复块, 否则会误点卡片重开师门
  - name: 师门-主流程结束跳板
    jump: 师门-脚本结束

  # ---------- 完成弹窗超时收尾块(仅 on_fail goto 进入, 顺序流不会走到) ----------
  # 2026-09-11 14:35 新增: 完成弹窗 30 分钟没等到(次数用完/被干扰/点击未生效)
  # 时, 关面板回主界面后直接收尾, 交由下一段徽标判定兜底, 不终止全家桶
  - name: 师门-超时收尾-关面板
    wait: {ui: 主界面}
    timeout: 5
    retry: 0
    on_success: {goto: "师门-脚本结束"}
    on_fail: continue

  # 2026-09-12 事故修复: 旧版只点一次返回+等主市面 15s×3 就放弃(今早实际停在玩法面板)。
  # 改练功区逃逸循环: 不在主界面就点左下角(面板=返回箭头/练功区=退出), 最多 6 轮
  - name: 师门-收尾逃逸循环
    loop: 6
    steps:
      - name: 师门-收尾-若在主界面则通过
        wait: {ui: 主界面}
        timeout: 3
        retry: 0
        on_success: {goto: "师门-收尾已回主界面"}
        on_fail: continue

      - name: 师门-收尾-点左下角返回
        click: [25, 922]
        on_fail: continue

      - name: 师门-收尾-停顿
        sleep: 1

  - name: 师门-收尾已回主界面
    sleep: 1

  - name: 师门-超时收尾-跳结束
    jump: 师门-脚本结束

  # ---------- 介绍页未开恢复块(仅 on_fail goto 进入, 顺序流不会走到) ----------
  # 2026-09-14 17:25 事故: 点卡片瞬间顶部弹系统公告横幅(藏宝图播报)吞掉点击,
  # 介绍页没开 → 等师门介绍页裸奔终止全家桶。兜底: 复核→等横幅消失→再点一次
  # 卡片→仍没开按超时收尾(交下一段徽标判定), 不许终止。
  - name: 师门-介绍页未开-复核
    wait: {ocr: 任务说明}
    timeout: 3
    retry: 0
    on_success: {goto: 判断是否需选师傅(新号)}
    on_fail: continue

  - name: 师门-介绍页未开-等横幅消失
    sleep: 6

  - name: 师门-介绍页未开-再点卡片
    click: {ocr: 师门任务}
    timeout: 8
    retry: 1
    on_fail: {goto: 师门-超时收尾-关面板}

  - name: 师门-介绍页未开-再等介绍页
    wait: {ocr: 任务说明}
    timeout: 8
    retry: 1
    on_fail: {goto: 师门-超时收尾-关面板}

  - name: 师门-介绍页未开-恢复完成
    jump: 判断是否需选师傅(新号)

  # ---------- 找卡恢复块(仅 on_fail goto 进入, 顺序流不会走到) ----------
  # 2026-09-11 新增: 找不到师门卡片时不许裸奔终止全家桶(与五环同款)
  # 2026-09-11 加固: 面板没开时(偶发点击被吞)先重开面板, 否则拉回顶部/找卡全空转
  # 2026-10-09 修复: 本块此前是死代码 —— 「点师门任务卡片」的 on_fail 直接
  #   goto 到"拉回顶部", 绕开了这里的重开面板逻辑。现改为两条入口都先经过本块,
  #   并按"面板已开/未开"决定要不要重开; 重开后补点「日常」页签再找卡。
  - name: 师门-恢复-若面板已开则直接找卡
    wait: {ui: 玩法面板}
    timeout: 3
    retry: 0
    on_success: {goto: "师门-找卡恢复-点日常页签"}
    on_fail: continue

  - name: 师门-恢复-点玩法按钮(1/2)
    click: [506, 539]

  - name: 师门-恢复-等面板出现(1/2)
    wait: {ui: 玩法面板}
    timeout: 5
    retry: 0
    on_success: {goto: "师门-找卡恢复-点日常页签"}
    on_fail: continue

  - name: 师门-恢复-点玩法按钮(2/2)
    click: [506, 539]

  - name: 师门-恢复-等面板出现(2/2)
    wait: {ui: 玩法面板}
    timeout: 5
    retry: 0
    on_success: {goto: "师门-找卡恢复-点日常页签"}
    on_fail: {goto: "师门-脚本结束"}

  # 重开面板后要先确保在「日常」页签, 否则卡片找不到(与主流程一致)
  - name: 师门-找卡恢复-点日常页签
    click: [95, 934]
    on_fail: continue

  - name: 师门-找卡恢复-页签停顿
    sleep: 1

  - name: 师门-找卡恢复-拉回顶部(1/2)
    swipe: {from: [270, 320], to: [270, 860], duration: 200}

  - name: 师门-找卡恢复-停顿1
    sleep: 1

  - name: 师门-找卡恢复-拉回顶部(2/2)
    swipe: {from: [270, 320], to: [270, 860], duration: 200}

  - name: 师门-找卡恢复-停顿2
    sleep: 1

  # 2026-10-19 v5.1.0: 队友申请弹窗("XX 申请顶替成为队伍队长", 6 秒后自动同意)
  # 会压在玩法面板上挡住卡面, 而且真的会把队长顶掉。判到就点「拒绝」。
  - name: 师门-找卡恢复-队伍申请判定
    wait: {ocr: 申请顶替成为队伍队长}
    timeout: 4
    retry: 0
    on_success: {goto: 师门-找卡恢复-点拒绝}
    on_fail: continue

  - name: 师门-找卡恢复-无申请跳板
    jump: 师门-找卡恢复-再点卡片

  - name: 师门-找卡恢复-点拒绝
    click: {ocr: 拒绝}
    timeout: 5
    retry: 0
    on_fail: continue

  - name: 师门-找卡恢复-拒绝后停顿
    sleep: 1

  - name: 师门-找卡恢复-再点卡片
    click: [270, 250]
    on_fail: continue

  - name: 师门-找卡恢复-等介绍页
    wait: {ocr: 任务说明}
    timeout: 10
    retry: 2
    on_success: {goto: 师门-找卡恢复-成功跳回流程}
    # ⚠ 找不到卡 ≠ 已完成。旧版 on_fail 直接 goto「已完成关面板」, 等于把
    # "没点进去"记成"已完成" → 师门零执行还静默收尾(2026-10-19 事故)。
    on_fail: {goto: 师门-脚本结束}

  - name: 师门-找卡恢复-成功跳回流程
    jump: 师门-若弹离线完成提示则点继续进行

  # ---------- 卡名被横幅遮挡时的兜底(仅 on_fail 进入, 顺序流不会走到) ----------
  # 2026-10-19 v5.1.0: 世界播报横幅会精确盖住第一张卡的卡名(见「点师门任务卡片」
  # 上方的注释)。卡面固定坐标绕开遮挡 —— 真机实测 tap(270,250) 落在
  # 「今日次数: x/5」那条(y241~259, 横幅到不了)上, 介绍页正常打开;
  # 而点卡名(被盖)、副标题、左侧立绘区都打不开, 别改。
  - name: 师门-找卡-遮挡兜底-面板在否
    wait: {ui: 玩法面板}
    timeout: 3
    retry: 0
    on_success: {goto: 师门-找卡-遮挡兜底-等横幅}
    on_fail: {goto: 师门-恢复-若面板已开则直接找卡}

  # 播报是滚动替换的: 等几秒通常就换走/消失, 再点固定坐标才不会被吞
  - name: 师门-找卡-遮挡兜底-等横幅
    sleep: 4

  - name: 师门-找卡-遮挡兜底-点卡面
    click: [270, 250]
    on_fail: continue

  - name: 师门-找卡-遮挡兜底-等介绍页
    wait: {ocr: 任务说明}
    timeout: 10
    retry: 1
    on_success: {goto: 师门-若弹离线完成提示则点继续进行}
    on_fail: {goto: 师门-恢复-若面板已开则直接找卡}

  - name: 师门-脚本结束
    sleep: 1
