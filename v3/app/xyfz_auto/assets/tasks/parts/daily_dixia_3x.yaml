# -*- coding: utf-8 -*-
# ============================================================
# 地煞星(10星地藏星) 自动挑战 ×3 —— 2026-09-09 真机实测可行
# ------------------------------------------------------------
# 流程: 主界面 → (组队: 无队伍则固定队创建+邀请, 已有队伍自动跳过)
#       → 玩法 → 地煞星卡片 → 10星「前往」→ 自动寻路到 NPC
#       → 点「挑战」→ 等待12秒 → 点「强制进入」→ 战斗自动进行至胜利
#       → 等「胜利」→ 点掉奖励结算弹窗 → 回到主界面
#
# 注意事项:
#   - 地煞星需组队挑战(建议3人以上), 前置组队容错与组队一条脚本一致:
#     已是队长则跳过创建, 直接开打
#   - 地煞星每日限 3 次(今日次数 0/3 才有效), 本脚本固定执行 3 轮
#   - 挑战后 30 秒倒计时, 前 10 秒「强制进入」不可点; 实测等 12 秒再点
#   - 2026-10-08: 队伍不满员时点挑战会弹确认窗 → 检测到即关掉并整段跳过
#     地煞(收尾后去师门/五环/域外); 兜底=等战斗开始45s失败也走同一收尾
#   - 结算「奖励总览/胜利」弹窗不会自动消失, 点屏幕下部深色区(450,700)关闭
#   - 玩法面板列表可滚动且记住位置, 每轮先下滑 2 次回到顶部再点地煞星卡
#   - 语法: 每步只写一个动作键(click/sleep/swipe 不能同步骤混写)
# ============================================================
name: 地煞星×3(10星地藏星)
description: 前置组队(容错已有队伍)→玩法→地煞星→10星前往→挑战→等12秒强制进入→等胜利, 打3次

# ------------------------------------------------------------
# 脚本选项(2026-10-07): 声明本脚本可调项 → GUI「脚本选项」页左侧选中
# 本脚本时, 右侧显示这些选项。script: 指明归属脚本(可省, 省=本文件)。
# 新脚本照抄这段结构即可(详见 engine/options.py)。
# ------------------------------------------------------------
options:
  script: parts/daily_dixia_3x.yaml
  title: 地煞星×3
  desc: 选择挑战哪一档星级(列表自动滚到最高可挑战档)
  items:
    - key: star_row
      section: dixia
      label: 挑战星级
      type: choice
      default: "auto"
      choices:
        - {text: "自动(推荐: 有10星点10星, 没有就点第1行)", value: "auto"}
        - {text: "第 1 行 (可视区最上面一行)", value: "row1"}
        - {text: "第 2 行", value: "row2"}
        - {text: "第 3 行", value: "row3"}
        - {text: "第 4 行 (可视区最下面一行)", value: "row4"}
      help: |-
        行 = 打开星级列表后, 可视区从上往下数第几行的「前往」。
        具体星级随角色不同: 62级小号实测第1~4行 = 1~4星(第4行=能打的最高档);
        主号(最高14星)打开时第1行 = 10星。不确定就选「自动」。

settings:
  default_timeout: 10
  default_retry: 2

steps:
  # ---------- 前置: 确保有队伍(已有队伍自动跳过) ----------
  # 2026-09-10 踩坑: daily_all 用 include 把多个脚本内联展开后,
  #   task.index_of() 只返回**首个**同名步骤 —— 本段与 daily_team_oneloop
  #   的同名步骤会互相串门(实测 goto 命中组队段, 地煞被劫持去跑组队一条)。
  #   所以本脚本所有"确认/开面板/邀请"类步骤统一加「地煞-」前缀!
  - name: 地煞-确认在主界面
    wait: {ui: 主界面}
    timeout: 10
    retry: 3
    on_fail: continue        # 2026-09-11: 不硬终止, 下列步骤会自己开面板导航

  - name: 地煞-打开固定队面板
    click: [506, 683]

  - name: 地煞-等固定队面板(有创建队伍按钮=无队伍)
    wait: {ocr: 创建队伍}
    timeout: 8
    retry: 2
    on_fail: {goto: 地煞-已有队伍关面板}

  # 2026-09-11 凌晨事故修复(与组队一条同款): 等待成功(=无队伍)后会顺序下滑
  # 进"已有队伍"分支,「地煞-点创建队伍」永远执行不到 → 必须 jump 跳过!
  - name: 地煞-无队伍-跳到创建队伍
    jump: 地煞-点创建队伍

  # 2026-09-10 下午修复死循环(与 daily_team_oneloop 同款):
  # 已在固定队时无「创建队伍」按钮,旧版 goto 到 wait 主界面必失败,
  # 关面板后顺序下滑又开面板 → 45→54→41 死循环。改为关面板后直接跳去开打
  - name: 地煞-已有队伍关面板
    click: [27, 930]

  - name: 地煞-已有队伍停顿
    sleep: 1

  - name: 地煞-已有队伍确认回主界面
    wait: {ui: 主界面}
    timeout: 15
    retry: 2
    on_fail: {goto: 地煞-再点返回箭头}

  - name: 地煞-已有队伍跳到开打
    jump: 确认在主界面(1/3)

  # 注意: 固定队页签的「离队」是退出固定队的常驻按钮,不能当“已在队伍”判据
  - name: 地煞-点创建队伍
    click: [168, 823]

  - name: 地煞-停顿2秒
    sleep: 1

  - name: 地煞-等邀请弹窗(没有则跳过邀请直接关面板)
    wait: {ocr: 一键邀请}
    timeout: 8
    on_fail: {goto: 地煞-关闭固定队面板回主界面}

  - name: 地煞-点邀请入队
    click: [370, 632]

  - name: 地煞-停顿3秒
    sleep: 2

  # 2026-09-10 修复: 22,916 点不中返回箭头导致整链卡死,改 27,930+兜底
  # 2026-09-11 加固(与组队段同款): 邀请后面板可能已自动关闭, 先确认面板特征
  # 还在才点(27,930), 否则会落在主界面左下角误入练功区
  - name: 地煞-关闭固定队面板回主界面
    wait: {any: [{ocr: 邀请入队}, {ocr: 加入队伍}]}
    timeout: 4
    retry: 0
    click: [27, 930]
    on_fail: continue

  - name: 地煞-关面板后停顿
    sleep: 1

  - name: 地煞-创建后确认回主界面
    wait: {ui: 主界面}
    timeout: 10
    retry: 1
    on_fail: {goto: 地煞-再点返回箭头}

  # 成功路径必须 jump 走,否则会滑到"再点返回箭头"在主界面乱点
  # (循环展开后首轮首步名为 确认在主界面(1/3))
  - name: 地煞-在主界面跳到开打
    jump: 确认在主界面(1/3)

  - name: 地煞-再点返回箭头
    click: [27, 930]

  - name: 地煞-再确认前停顿
    sleep: 1

  - name: 地煞-最终确认主界面
    wait: {ui: 主界面}
    timeout: 15
    retry: 2
    on_fail: continue

  # ---------- 固定 3 轮挑战 ----------
  - name: 打一轮10星地煞
    loop: 3
    steps:
      # 2026-09-29 加固: 本步无 on_fail 时上一轮残留弹窗会让它重试耗尽
      # 直接终止整个全家桶(09:17 趟次实录)。改为 continue, 让后续步骤
      # 自行导航; 最终走 等回主界面 的恢复出口兜底
      - name: 确认在主界面
        wait: {ui: 主界面}
        timeout: 10
        retry: 3
        on_fail: continue

      - name: 打开玩法面板
        click: [506, 539]

      - name: 等玩法面板出现
        wait: {ui: 玩法面板}
        timeout: 10
        retry: 3

      - name: 玩法列表下拉回顶(1/2)
        swipe: {from: [270, 320], to: [270, 860], duration: 200}

      - name: 停顿1秒
        sleep: 1

      - name: 玩法列表下拉回顶(2/2)
        swipe: {from: [270, 320], to: [270, 860], duration: 200}

      - name: 停顿1秒
        sleep: 1

      # 2026-09-11 优化: 卡片位置会变,固定坐标会点错(曾点开师门任务介绍页),
      # 改为 OCR 直接点击"挑战地煞"文字位置
      # 2026-09-11 上午事故修复: 一条龙还没跑完(商旅护送战斗中)时玩法面板
      # 根本没开出来,这里找不到字 → 旧版无 on_fail 直接终止整个全家桶。
      # 改为跳"卡片未找到恢复"块: 等战斗结束再重试一次,仍失败按已完成收尾
      - name: 当地煞星卡可见则点它
        wait: {ocr: 挑战地煞}
        click: {ocr: 挑战地煞}
        timeout: 8
        retry: 2
        on_fail: {goto: 地煞-卡片未找到恢复-关玩法面板}

      # 2026-09-10 新增: 该玩法离线期间已完成时, 点入口会弹
      # 「当前玩法已在离线期间完成,是否前往领取奖励?」挡住后续流程
      # → OCR 到「继续进行」就点它(奖励由领奖脚本的玩法面板宝箱统一领)
      - name: 地煞-若弹离线完成提示则点继续进行
        optional: true      # 条件探测: 没这个弹窗/面板属正常, 不计入失败统计
        wait: {ocr: 继续进行}
        timeout: 6
        retry: 0
        click_center: true
        on_fail: continue

      # 2026-09-11 低等级兼容(62级小号实测): 各等级星级列表不同
      # (62级=1~4星地纷/地恶/地囚/地魔, 无「10星地藏星」字样),
      # 详情页判定改用通用文字「今日次数」; 找不到=详情页没开, 走恢复块不再裸奔
      - name: 等进入星级选择列表
        wait: {ocr: 今日次数}
        timeout: 8
        retry: 3
        on_fail: {goto: 地煞-卡片未找到恢复-关玩法面板}

      # 2026-09-10 傍晚新增: 详情页出现 3/3 = 今日地煞已打完。
      # 不加守卫会在这里反复重试后终止 → 全家桶后面的师门/五环/域外被跳过
      # (面板底部活跃度 150/150 不含子串 50/50, 不会误匹配; 0/3、1/3 也不会)
      - name: 地煞-若今日次数已满3/3则跳过
        wait: {ocr: 3/3}
        timeout: 5
        retry: 0
        # 2026-09-11 修复: 改跳关面板块 —— 原 goto 结束时详情页还开着,
        # 下一段「确认主界面」会卡死到超时终止(10:00 事故)
        on_success: {goto: "地煞-关面板-若在主界面则完成(1/6)"}
        on_fail: continue

      # ============================================================
      # 2026-10-07 星级选择(GUI「脚本选项」可调, config.yaml dixia.star_row):
      #   auto = 旧默认(OCR 10星→点; 无10星=点第一行)
      #   row1~row4 = 列表从上数第1~4行。列表自动滚到最高可挑战档,
      #   显示的4行=最高可挑战及以下(13星号实测: 显示10/11/12/13星四行,
      #   62级小号显示1~4星, 第一行都是"最高减3"), 行 y≈372/455/537/620
      # 分支写法: jump 目标含 {{cfg:...}} 占位符, 加载时替换(loader 新功能)。
      # 循环内步骤展开后带 (1/3) 后缀, 目标必须写全名含 (1/3)
      # ============================================================
      - name: 地煞-星级模式分支
        jump: "地煞-星级-{{cfg:dixia.star_row}}(1/3)"

      # ---- 各模式跳转块(互斥, 命中一个后 jump 走, 不会顺序下滑) ----
      - name: 地煞-星级-auto
        jump: 地煞-若有10星则点10星前往(1/3)

      - name: 地煞-星级-row1
        jump: "地煞-点指定行前往-row1(1/3)"

      - name: 地煞-星级-row2
        jump: "地煞-点指定行前往-row2(1/3)"

      - name: 地煞-星级-row3
        jump: "地煞-点指定行前往-row3(1/3)"

      - name: 地煞-星级-row4
        jump: "地煞-点指定行前往-row4(1/3)"

      # ---- 指定行模式(row1~row4): 每行=点前往→跳"详情页应关闭"守卫 ----
      # (放在 auto 路径目标[10星/低等级]之前: auto 命中后从分支块直接跳走,
      #  永远不会顺序流进这些行块; 行块自己也以 jump 收尾, 防顺序下滑重复点击)
      - name: 地煞-点指定行前往-row1
        click: [438, 372]
        on_fail: {goto: "地煞-关面板-若在主界面则完成(1/6)"}

      - name: 地煞-指定行row1已点跳守卫
        jump: "等离开星级详情页(前往没点中守卫)(1/3)"

      - name: 地煞-点指定行前往-row2
        click: [438, 455]
        on_fail: {goto: "地煞-关面板-若在主界面则完成(1/6)"}

      - name: 地煞-指定行row2已点跳守卫
        jump: "等离开星级详情页(前往没点中守卫)(1/3)"

      - name: 地煞-点指定行前往-row3
        click: [438, 537]
        on_fail: {goto: "地煞-关面板-若在主界面则完成(1/6)"}

      - name: 地煞-指定行row3已点跳守卫
        jump: "等离开星级详情页(前往没点中守卫)(1/3)"

      - name: 地煞-点指定行前往-row4
        click: [438, 620]
        on_fail: {goto: "地煞-关面板-若在主界面则完成(1/6)"}

      - name: 地煞-指定行row4已点跳守卫
        jump: "等离开星级详情页(前往没点中守卫)(1/3)"

      # 2026-09-11 低等级兼容: 高等级(有10星)走原固定坐标; 成功后必须
      # goto 跳过低等级分支(分支铁律: 否则顺序下滑会再点一次「前往」)
      # 2026-09-29 事故修复: 10星行的「前往」按钮中心 x≈438(与低等级分支
      # 的 435 一致), 旧坐标 413 偏左落在奖励图标上 —— 点中图标只弹物品
      # 详情, 详情页不关、寻路不开始, 后面全链盲点全点在面板上(09:17 趟次
      # 任务终止的直接根源)
      - name: 地煞-若有10星则点10星前往
        optional: true      # 条件探测: 游戏自己决定出不出现, 没有属正常 → 不计入真失败
        wait: {ocr: 10星地藏星}
        timeout: 4
        retry: 0
        click: [438, 372]
        on_success: {goto: "等寻路到地煞NPC(出现台词)(1/3)"}
        on_fail: continue

      # 低等级(62级=1~4星): 「前往」是美术字 OCR 认不出(实测), 改固定坐标
      # 点列表第一行「前往」(=1星,必解锁,第一行位置各等级固定), 打满3次即完成每日
      - name: 地煞-低等级点首个前往
        click: [438, 372]
        on_fail: {goto: "地煞-关面板-若在主界面则完成(1/6)"}

      # 2026-09-29 事故修复: 详情页表头"当前最高可挑战14星地煞"含「挑战」二字!
      # 前往没点中时详情页还开着 → 本步 4 秒假命中 → 点挑战/点强制进入全盲点
      # 在面板上(09:17 趟次实录: 09:51:46 假命中, 09:52 起战斗永远等不到)。
      # 先等详情页真正关掉(前往成功时游戏会自动收起面板进寻路), 没关=没点中
      - name: 等离开星级详情页(前往没点中守卫)
        wait: {not: {ui: 玩法面板}}
        timeout: 15
        retry: 0
        on_fail: {goto: 地煞-战斗未开始恢复}

      # 2026-09-11: 低等级 NPC 台词不同, 除「神官」外加「挑战」双信号;
      # 失败不再裸奔(旧版这里失败会终止整个全家桶)
      - name: 等寻路到地煞NPC(出现台词)
        wait: {any: [{ocr: 神官}, {ocr: 挑战}]}
        timeout: 90
        retry: 0
        on_fail: continue

      - name: 点挑战
        click: [349, 601]

      # ============================================================
      # 2026-10-08 队伍不满人跳过(用户实测): 队伍不满员时点「挑战」会先弹
      # 一个确认弹窗(人数不足/是否继续类), 脚本原流程不认识它 → 后面
      # 点强制进入/等战斗全盲点, 一轮空耗约 7 分钟。改为: 检测到确认
      # 弹窗立刻关掉 → 收尾 → 跳到师门/五环/域外(地煞整段放弃)。
      # 文字信号按子串匹配; 若实际弹窗文案不同, 兜底在「等战斗开始」
      # 失败分支(见下), 同样会跳过, 只是多等 ~45 秒。
      # ============================================================
      - name: 地煞-若弹队伍不满确认则跳过
        wait: {any: [{ocr: 人数不足}, {ocr: 队伍不满}, {ocr: 是否继续}]}
        timeout: 4
        retry: 0
        # 2026-10-09 重大修复: 只有本步**真命中**弹窗时才 goto 跳过块;
        # 未命中(队伍满 / 文案不符)则 on_fail continue 顺序流继续走
        # "等12秒→点强制进入→等战斗"正常开打。旧版把"点取消→收尾"紧贴在
        # 本步之后且 on_fail: continue, 无弹窗时也顺序滑进跳过分支 →
        # 地煞一次没打成却记成"已完成"(账号2 实录: 点挑战后 4s 无弹窗 →
        # 点取消失败 → jump 收尾 → 整段跳过)。
        on_success: {goto: "地煞-队伍不满-点取消"}
        on_fail: continue

      - name: 等12秒(强制进入按钮10秒后可点)
        sleep: 12

      - name: 点强制进入
        click: [267, 560]

      # 2026-09-14 事故修复: 组队地煞战斗画面 OCR 无「回合」字样(公告横幅遮挡/
      # 布局差异), 改多信号: 回合/自动中/逃跑 任一出现=已在战斗中。
      # 2026-10-08 改跳过: 45 秒仍等不到战斗=挑战没打出去(队伍不满确认弹窗/
      # 获取途径弹窗等挡住, 00:29 趟次实录空耗 7 分钟) → 直接进恢复块收尾,
      # 放弃地煞去跑师门/五环/域外(用户决策: 少打一次总比卡死强)
      - name: 等战斗开始(出现回合)
        wait: {any: [{ocr: 回合}, {ocr: 自动中}, {ocr: 逃跑}]}
        timeout: 15
        on_fail: {goto: 地煞-恢复-若获取途径弹窗开着则点X}

      # 2026-09-10 优化: 原"等胜利420s"单信号太慢且易漏(胜利横幅可能一闪而过),
      # 改为多信号判定: 胜利/失败/结算弹窗任一出现立即通过, 上限3分钟
      - name: 等战斗结束(胜利/失败/结算弹窗任一)
        wait: {any: [{ocr: 胜利}, {ocr: 失败}, {ocr: 奖励总览}, {ocr: 获得奖励}]}
        timeout: 180
        retry: 0
        on_fail: continue

      - name: 若出现结算弹窗则点掉
        optional: true      # 条件探测: 游戏自己决定出不出现, 没有属正常 → 不计入真失败
        wait: {any: [{ocr: 奖励总览}, {ocr: 获得奖励}]}
        click: [450, 700]
        timeout: 8
        retry: 1
        on_fail: continue

      - name: 停顿2秒
        sleep: 1

      - name: 若还有结算弹窗再点一次
        optional: true      # 条件探测: 游戏自己决定出不出现, 没有属正常 → 不计入真失败
        wait: {any: [{ocr: 奖励总览}, {ocr: 获得奖励}]}
        click: [450, 700]
        timeout: 8
        retry: 0
        on_fail: continue

      - name: 停顿2秒
        sleep: 1

      # 结算弹窗若已自动消失, 这步会立即通过, 不再空等
      # 2026-09-29 加固: 面板/弹窗没收干净时旧版 continue → 下一轮
      # 「确认在主界面」再失败 → 整个全家桶终止。改为进关面板循环优雅收尾
      - name: 等回主界面
        wait: {ui: 主界面}
        timeout: 30
        retry: 2
        on_fail: {goto: "地煞-关面板-若在主界面则完成(1/6)"}

  # 2026-10-18 v4.3.0 (P0-2): 收尾验收 —— 以玩法面板「已完成」徽标为权威。
  # 地煞做成了 = 卡片挂「已完成」徽标; 没挂 = 没做成。验收失败只改子任务结论,
  # 不算任务失败(探测性质), 但必须记 verified=False, 不能再静默报"成功 ✔"。
  # 注意: 关面板前先确认面板确实开着 —— 本脚本多处警告 [22,916] 在主界面会误开练功区。
  - name: 地煞-验收-打开玩法面板
    click: [506, 539]
    timeout: 5
    retry: 1
    on_fail: continue

  - name: 地煞-验收-等面板出现
    wait: {ui: 玩法面板}
    timeout: 8
    retry: 1
    on_fail: continue

  - name: 地煞-验收-点日常页签
    click: [95, 934]
    on_fail: continue

  - name: 地煞-验收-列表回顶
    swipe: {from: [270, 320], to: [270, 860], duration: 200}
    on_fail: continue

  - name: 地煞-验收-回顶停顿
    sleep: 1

  - name: 地煞-验收-看已完成徽标
    wait: {ocr_pair: [已完成, 地煞星], pair_min_score: 0.62, pair_min_x: 250}
    timeout: 12  # v5.1.0: 单帧≈截图0.8s+全图OCR5.2s, 5s 只够判 1 帧
    retry: 0
    verify_done: true
    on_success: {goto: 地煞-验收-检测面板是否开着}
    on_fail: continue

  - name: 地煞-验收-复核停顿
    sleep: 3

  - name: 地煞-验收-复核徽标
    wait: {ocr_pair: [已完成, 地煞星], pair_min_score: 0.62, pair_min_x: 250}
    timeout: 12  # v5.1.0: 单帧≈截图0.8s+全图OCR5.2s, 5s 只够判 1 帧
    retry: 0
    verify_done: true
    # 2026-10-18 v4.4.0: 复核步=同卡二次确认, OR 合并(检查✘→复核✔ 仍算完成)
    verify_retry: true
    on_fail: continue

  - name: 地煞-验收-检测面板是否开着
    wait: {ui: 玩法面板}
    timeout: 3
    retry: 0
    on_fail: {goto: 地煞-验收-等回主界面}

  - name: 地煞-验收-关面板
    click: [22, 916]
    on_fail: continue

  - name: 地煞-验收-等回主界面
    wait: {ui: 主界面}
    timeout: 10
    retry: 1
    on_fail: continue

  # 主路径直接跳结束(必须跳过下方关面板块——主界面再点返回箭头会误开练功区)
  - name: 地煞-打完跳到结束
    jump: 结束

  # ---------- 队伍不满-跳过块(仅循环内检测步 on_success goto 进入, 顺序流不会走到) ----------
  # 2026-10-09 修复: 本块从循环内搬到循环外 —— goto 目标名不带 (x/3) 后缀,
  # 第2/3轮检测到弹窗也能稳定跳到这里(循环内硬编码 (1/3) 会把第2/3轮劫持回第1轮)。
  - name: 地煞-队伍不满-点取消
    click: {ocr: 取消}
    on_fail: continue

  - name: 地煞-队伍不满-停顿
    sleep: 1

  # 走恢复块收尾(顺带处理可能叠着的获取途径弹窗) → 关面板 → 结束
  - name: 地煞-队伍不满-跳到收尾
    jump: 地煞-恢复-若获取途径弹窗开着则点X

  # 2026-09-11 新增: 3/3 已满跳过路径专用 —— 关玩法面板(含详情页)再收尾
  # 2026-09-11 11:36 重大发现: 左下角(22,916/25,922)是个"开关"——
  # 面板开着时=返回箭头, 主界面时=练功区入口, 练功区里=退出练功区。
  # 盲点多点会恰好停在练功区(11:28/11:36 两次事故)。
  # 正确做法: 循环"先检测主界面, 不在才点一下左下角", 最多6轮必收敛。
  - name: 地煞-已完成关面板回主界面
    loop: 6
    steps:
      - name: 地煞-关面板-若在主界面则完成
        wait: {ui: 主界面}
        timeout: 3
        retry: 0
        on_success: {goto: "地煞-关面板完成"}
        on_fail: continue

      - name: 地煞-关面板-点左下角返回
        click: [25, 922]
        on_fail: continue

      - name: 地煞-关面板-停顿
        sleep: 1

  - name: 地煞-关面板完成
    sleep: 1

  - name: 地煞-已完成跳到结束
    jump: 结束

  # ---------- 卡片未找到恢复块(仅 on_fail goto 进入, 顺序流不会走到) ----------
  # 2026-09-11 10:33 事故新增: 场上有战斗/结算画面挡住玩法面板时找不到
  # 「挑战地煞」。恢复: 关面板 → 长等(5分钟)战斗结束回主界面 → 重开面板
  # 再找一次 → 仍找不到则按"地煞已完成"关面板收尾, 全家桶继续跑师门。
  # 注意: 本块结尾必须 jump, 否则顺序下滑会掉进"结束"或循环尾, 逻辑错乱
  # 2026-09-11 加固: 先检测面板是否开着 —— 主界面时点左下角(22,916)会误入练功区!
  - name: 地煞-恢复-若面板没开则跳过关面板
    wait: {ui: 玩法面板}
    timeout: 3
    retry: 0
    on_fail: {goto: 地煞-恢复停顿3秒}

  - name: 地煞-卡片未找到恢复-关玩法面板
    click: [22, 916]
    on_fail: continue

  - name: 地煞-恢复停顿3秒
    sleep: 3

  - name: 地煞-恢复等回主界面(等战斗/结算结束)
    wait: {ui: 主界面}
    timeout: 300
    retry: 0
    on_fail: continue

  - name: 地煞-恢复重开玩法面板
    click: [506, 539]

  - name: 地煞-恢复等玩法面板出现
    wait: {ui: 玩法面板}
    timeout: 10
    retry: 2
    on_fail: {goto: "地煞-关面板-若在主界面则完成(1/6)"}

  - name: 地煞-恢复下拉回顶(1/2)
    swipe: {from: [270, 320], to: [270, 860], duration: 200}

  - name: 地煞-恢复停顿1秒(1/2)
    sleep: 1

  - name: 地煞-恢复下拉回顶(2/2)
    swipe: {from: [270, 320], to: [270, 860], duration: 200}

  - name: 地煞-恢复停顿1秒(2/2)
    sleep: 1

  - name: 地煞-恢复再找地煞卡
    wait: {ocr: 挑战地煞}
    click: {ocr: 挑战地煞}
    timeout: 8
    retry: 2
    on_fail: {goto: "地煞-关面板-若在主界面则完成(1/6)"}

  # 恢复成功 → 跳回循环内第 1 轮的"离线提示"步骤, 第 2/3 轮照常继续
  - name: 地煞-恢复成功跳回星级流程
    jump: 地煞-若弹离线完成提示则点继续进行(1/3)

  # ---------- 战斗未开始恢复块(2026-09-29 新增, 仅 on_fail goto 进入) ----------
  # 进入时屏上可能叠着: 物品详情 tooltip / 获取途径弹窗 / 星级详情页
  # (09:17 趟次: 前往没点中 → 详情页没关 → 盲点点出物品详情 → 全链等不到战斗
  #  → 等回主界面 ×3 失败 → 确认在主界面 ×4 失败 → 整个全家桶终止)。
  # 注意: 不跳回重打 —— 前往坐标没点中是确定性的(布局没变就会一直点不中),
  # 跳回=死循环。统一关掉所有浮层后按本段结束收尾, 少打一次总比卡死强
  - name: 地煞-恢复-若获取途径弹窗开着则点X
    optional: true      # 条件探测: 游戏自己决定出不出现, 没有属正常 → 不计入真失败
    wait: {ocr: 获取途径}
    timeout: 3
    retry: 0
    click: [487, 347]
    on_fail: continue

  - name: 地煞-恢复-关弹窗后停顿
    sleep: 1

  - name: 地煞-战斗未开始恢复
    jump: "地煞-关面板-若在主界面则完成(1/6)"

  - name: 结束
    sleep: 1
