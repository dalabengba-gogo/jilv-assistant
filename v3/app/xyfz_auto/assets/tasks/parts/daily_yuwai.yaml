# -*- coding: utf-8 -*-
# ============================================================
# 域外风情/修罗任务(每日额外50次) —— 2026-09-10 实测更新
# ------------------------------------------------------------
# 流程: 主界面 → 玩法面板(日常页签,列表回顶) → OCR点卡片
#       → 介绍页点「前往」(350,795,介绍页右下,左边是组队按钮)
#       → 寻路(灵兽村)进战斗 → 战斗自动进行(无需点自动) → 连打额外次数
#       → 期间无任何弹窗(实测不弹奖励界面), 长等主界面即可
#
# 注意:
#   - 同一活动不同等级角色显示名不同(用户确认): 高等级=域外风情/修罗任务,
#     低等级=抓鬼任务(2026-09-11 用户确认卡名,非鬼王)。三个名字都试;
#     引擎 OCR 是子串包含匹配, 关键字不会误匹配(需完整子串出现)
#   - 分两部分: 组队一条含的10次多倍 + 每日额外50次
#     本脚本跑的是介绍页里的「今日额外次数: x/50」, 与组队一条互不影响
#   - 卡片在「日常」页签, 位置会变用 OCR 定位; 2026-09-28 起改为「逐屏滚动找卡」
#     (最多 6 屏): 实测首屏已被 挖宝封妖/烧法任务/商旅护送/帮派任务 占满,
#     域外风情被挤到下面, 只回顶一次是找不到的
#   - 介绍页底部: 组队(190,795) / 前往(350,795), 别点错左边的组队
#   - ★ 必须 3 人组队: 单人时点「前往」游戏**静默拒绝**(页面纹丝不动, 不弹提示)。
#     2026-10-19 v5.2.1 起脚本自己点「组队」→「开始招募」→ 侠客助战自动补满
#     →「人数已满,是否开始域外风情」→「确定」直接开打, 不再依赖前置队伍。
#   - 50 场约 40~90 分钟(实测双高转队伍约 40 分钟), 监控循环 60 轮×90 秒兜底
#   - 实测: 点「前往」后整段 50 次自动连续推进(寻路→战斗自动→下一场),
#     全程不弹奖励结算界面(用户实测)
#   - ★ 2026-10-16 用户确认完成判定标准: 玩法面板上的次数**不实时刷新**, 不可信;
#     权威信号 = 「域外卡片变灰(带已完成徽标)」—— 灰=做完, 高亮=还有剩余次数。
#     所以完成判定统一走「批次后回主界面停稳 → 重开面板 → 查已完成徽标(ocr_pair)」;
#     面板上的 50/50 检查已删(面板根本不显示 50/50, 从未命中过, 纯拖慢 5 秒/轮);
#     介绍页的 50/50 检查保留作快速通道(介绍页的次数是实时准确的)
#   - 语法: 每步只写一个动作键(click/sleep/swipe 不能同步骤混写)
# ============================================================
name: 域外风情(额外50次)
description: 玩法面板→OCR点域外风情卡→介绍页点前往→托管连打→长等主界面

settings:
  default_timeout: 10
  default_retry: 2

steps:
  - name: 确认主界面
    wait: {ui: 主界面}
    timeout: 10
    retry: 3
    # 2026-09-11: 不硬终止 —— 上段若遗留浮层, 本段随后会自己重开面板导航
    on_fail: continue

  - name: 打开玩法面板
    click: [506, 539]

  - name: 等玩法面板出现
    wait: {ui: 玩法面板}
    timeout: 5
    retry: 0
    # 2026-09-11 11:48 事故修复: 偶发点击被吞(主界面点玩法按钮无响应),
    # 旧版干等30秒后继续, 面板没开导致整段空转静默跳过。改为 goto 重开块重试2次
    on_fail: {goto: "域外-面板重开-点玩法按钮(1/2)"}

  # 2026-09-10 新增: 确保在「日常」页签(卡片在这个页签里)
  - name: 域外-点日常页签(确保在正确页签)
    click: [95, 934]
    on_fail: continue

  - name: 页签切换停顿
    sleep: 1

  # ---------- 列表回顶, 保证「域外风情」在首屏 ----------
  - name: 玩法列表下拉回顶(1/2)
    swipe: {from: [270, 320], to: [270, 860], duration: 200}

  - name: 停顿1秒
    sleep: 1

  - name: 玩法列表下拉回顶(2/2)
    swipe: {from: [270, 320], to: [270, 860], duration: 200}

  - name: 停顿1秒
    sleep: 1

  # 2026-10-16: 删掉旧的「面板查 50/50」步骤 —— 玩法面板上根本不显示 50/50
  # (只在点进介绍页才有), 且面板次数不实时刷新; 完成判定统一交给「已完成」徽标。

  # ---------- 逐屏滚动找卡(2026-09-28 重写) ----------
  # 事故: 用户反馈"域外被其他任务遮挡, 识别不到"。现场截图 + OCR 实测:
  #   日常页签首屏已变成 挖宝封妖 / 烧法任务 / 商旅护送 / 帮派任务 四张卡,
  #   「域外风情/修罗任务/抓鬼任务」被挤到列表更下面 —— 旧版只做"回顶"然后
  #   直接 OCR 点卡(注释里那句"修罗任务在第一位"早就过期了), 三步全找不到,
  #   于是整段域外静默跳过。
  # 新做法: 从顶部开始一屏一屏往下找, 每屏先查「已完成」徽标、再点三种卡名,
  #   没找到就上滑一屏继续, 最多 6 屏; 6 屏都没有才走找卡恢复块。
  # 卡名三选一铁律不变: 除最后一个外都 continue, 成败判定交给「等介绍页」。
  - name: 域外-滚动找卡循环
    loop: 6
    steps:
      # 低等级号任务做完后面板卡片显示「已完成」徽标(额外次数永远到不了 50/50
      # 的账号也会完成), 只认 50/50 会无限批次循环 → 卡片可见时查徽标就收尾
      - name: 域外-滚动-查已完成徽标(域外风情)
        wait: {ocr_pair: [已完成, 域外风情]}
        timeout: 3
        retry: 0
        on_success: {goto: "域外-结束前检测是否已在主界面"}
        on_fail: continue

      - name: 域外-滚动-查已完成徽标(修罗任务)
        wait: {ocr_pair: [已完成, 修罗任务]}
        timeout: 3
        retry: 0
        on_success: {goto: "域外-结束前检测是否已在主界面"}
        on_fail: continue

      - name: 域外-滚动-查已完成徽标(抓鬼任务)
        wait: {ocr_pair: [已完成, 抓鬼任务]}
        timeout: 3
        retry: 0
        on_success: {goto: "域外-结束前检测是否已在主界面"}
        on_fail: continue

      - name: 域外-滚动-点域外风情卡片
        optional: true      # 三选一: 本等级只有其中一张卡存在, 找不到另两张属正常(成败由「等介绍页」判定)
        click: {ocr: 域外风情}
        timeout: 6
        retry: 0
        on_fail: continue

      - name: 域外-滚动-点修罗任务卡片
        optional: true      # 条件探测: 没这个弹窗/面板属正常, 不计入失败统计
        click: {ocr: 修罗任务}
        timeout: 6
        retry: 0
        on_fail: continue

      - name: 域外-滚动-点抓鬼任务卡片
        optional: true      # 条件探测: 没这个弹窗/面板属正常, 不计入失败统计
        click: {ocr: 抓鬼任务}
        timeout: 6
        retry: 0
        on_fail: continue

      # 三选一的成败统一在这里判定: 介绍页开了就跳回主流程
      - name: 域外-滚动-等介绍页
        wait: {ocr: 任务说明}
        timeout: 5
        retry: 0
        on_success: {goto: "域外-若弹离线完成提示则点继续进行"}
        on_fail: continue

      - name: 域外-滚动-上滑一屏继续找
        swipe: {from: [270, 700], to: [270, 260], duration: 250}

      - name: 域外-滚动-停顿
        sleep: 1

  # 顺序流走到这里 = 6 屏都没找到卡片 → 交给找卡恢复块(拉回顶部, 只在顶部再试一次;
  # 那一块是固定次数、失败即关面板收尾, 所以不会和本循环形成死循环)
  - name: 域外-滚动找卡-六屏都没找到
    jump: 域外-找卡恢复-拉回顶部(1/2)

  # 2026-09-10 新增: 该玩法离线期间已完成时, 点入口会弹
  # 「当前玩法已在离线期间完成,是否前往领取奖励?」挡住后续流程
  # → OCR 到「继续进行」就点它(奖励由领奖脚本的玩法面板宝箱统一领)
  - name: 域外-若弹离线完成提示则点继续进行
    optional: true      # 条件探测: 没这个弹窗/面板属正常, 不计入失败统计
    wait: {ocr: 继续进行}
    timeout: 6
    retry: 0
    click_center: true
    on_fail: continue
  - name: 等介绍页(任务说明)
    wait: {ocr: 任务说明}
    timeout: 8
    retry: 2
    on_fail: {goto: "域外-找卡恢复-关面板收尾"}

  # 2026-09-16 事故修复(00:10/07:19 两轮同款): 50/50 只显示在介绍页上,
  # 玩法面板卡片上 OCR 认不出 → 面板上查 50/50 永远失败 → 已做完也再点
  # 卡片/前往死循环。介绍页开着时在这里查: 已满直接收尾, 不再点前往
  - name: 域外-介绍页查额外次数已满50
    wait: {ocr: 50/50}
    timeout: 5
    retry: 0
    on_success: {goto: "域外-结束前检测是否已在主界面"}
    on_fail: continue

  # 2026-10-19 v5.2.1 事故(账号2 整天 0/50): 域外是「3人组队」玩法(介绍页写着
  # 人数: 3人组队, 卡片角标是「组队」)。角色处于单人时点「前往」被游戏**静默拒绝**
  # —— 介绍页纹丝不动, 白等 120s 后才被「前往无效则收尾」判死, 域外整天没做。
  # 实测可行路径(2026-10-19 14:30 真机):
  #   点「组队」(190,795) → 招募窗(队伍目标已预填"域外风情:3转66级-3转141级")
  #   → 点「开始招募」→ 侠客助战自动补满 → 弹「人数已满，是否开始域外风情」
  #   → 点「确定」直接开打(不用再点前往)。
  # 队伍已满时点组队会直接开「队伍面板」(没有开始招募) → 关掉面板再点前往。
  - name: 域外-点组队(3人组队玩法)
    click: [190, 795]
    on_fail: continue
  - name: 域外-等招募窗出现
    wait: {ocr: 开始招募}
    timeout: 6
    retry: 1
    on_success: {goto: 域外-点开始招募}
    on_fail: {goto: 域外-关掉组队层}
  - name: 域外-点开始招募
    click: {ocr: 开始招募}
    on_fail: {goto: 域外-关掉组队层}
  - name: 域外-等人数已满提示
    wait: {ocr: 人数已满}
    timeout: 10
    retry: 1
    on_success: {goto: 域外-点确定直接开打}
    on_fail: {goto: 域外-关掉组队层}
  - name: 域外-点确定直接开打
    click: [368, 632]
    on_fail: continue
  - name: 域外-确定后跳过前往
    jump: 等战斗出现(寻路后,最长2分钟)

  - name: 域外-关掉组队层
    click: [484, 133]
    on_fail: continue
  - name: 域外-关掉组队层停顿
    sleep: 1
  - name: 域外-组队后确认回到介绍页
    wait: {ocr: 任务说明}
    timeout: 6
    retry: 1
    on_success: {goto: 点前往(介绍页右下按钮)}
    on_fail: continue
  - name: 域外-组队后关队伍面板(左下角)
    click: [30, 915]
    on_fail: continue
  - name: 域外-组队后停顿2
    sleep: 1
  - name: 域外-组队后回介绍页确认
    wait: {ocr: 任务说明}
    timeout: 6
    retry: 1
    on_fail: {goto: 域外-前往无效则收尾}

  - name: 点前往(介绍页右下按钮)
    click: [350, 795]

  # ---------- 开打 ----------
  - name: 等战斗出现(寻路后,最长2分钟)
    # 2026-09-14: 多信号(回合/自动中/逃跑), 组队/横幅遮挡时「回合」可能不可见
    wait: {any: [{ocr: 回合}, {ocr: 自动中}, {ocr: 逃跑}]}
    timeout: 120
    on_fail: continue

  # 2026-10-19 v5.2.1: 等不到战斗先换落点补点一次, 再判"前往无效", 别一击就收尾
  - name: 域外-前往补点(换落点)
    click: [351, 810]
    on_fail: continue
  - name: 域外-补点后等战斗出现(60秒)
    wait: {any: [{ocr: 回合}, {ocr: 自动中}, {ocr: 逃跑}]}
    timeout: 60
    on_fail: continue

  # 2026-09-16 加固: 点前往没生效(已完成50/50/点击被吞)时介绍页还开着 ——
  # 旧版直接流入「等打完回主界面(90分钟)」死等, 介绍页挡着永远等不到。
  # 介绍页还在=没开打, 直接收尾
  - name: 域外-前往无效则收尾
    wait: {ocr: 任务说明}
    timeout: 4
    retry: 0
    on_success: {goto: "域外-结束前检测是否已在主界面"}
    on_fail: continue

  # 2026-09-23 傍晚修复: 点前往后介绍页关了但**玩法面板还开着**(游戏行为,
  # 低等级号实测)——面板盖住画面, 下方 90 分钟等待永远看不到主界面,
  # 实测白等 3 小时(任务其实早做完了)。等待前先把面板关掉
  - name: 域外-长等前若面板开着则关闭
    optional: true      # 条件探测: 游戏自己决定出不出现, 没有属正常 → 不计入真失败
    wait: {ui: 玩法面板}
    timeout: 3
    retry: 0
    click: [27, 930]
    on_fail: continue

  - name: 域外-长等前停顿
    sleep: 2

  # 2026-09-11 修改(用户实测): 域外/修罗全程不弹奖励结算界面,
  # 删掉原来的「清理结算弹窗」循环, 改为长等待 + 复核:
  # 50 场约 40~90 分钟, 打完自动回主界面。
  # 2026-09-11 11:59 事故修复: 单次 wait 主界面 会在两场战斗之间/寻路瞬间
  # 误判"打完了"→脚本提前退出(失去监控, 若被弹窗堵死没人处理)。
  # 改为「主界面 + 无『回合』」双条件复核, 不安静就跳回长等(每轮约2.5分钟)。
  # ★ 2026-10-19 v5.2.0 防环守卫: 下面的环是
  #   [等打完回主界面] → [关面板] → [停顿] → [复核仍在主界面]/[复核无战斗]
  #   —— 后两个的 on_fail 都 goto 回第一步。战斗中一旦假阳性, 这个环没有出口。
  #   与批次后那条同型, 统一用 max_visits 兜住。
  - name: 域外-主流程等待守卫
    sleep: 0.2
    # 2026-10-28 修复: max_visits 6→15。原 6 是在「自动中」误判导致每轮都跳回守卫
    # (约1.5分钟一次)时设的; 改完误判后守卫只在每批入口命中一次, 5~6 批次就需要
    # 6 次, 故放宽到 15 以容纳正常批次数 + 余量; 真卡死仍由此处兜底收尾。
    # 2026-10-29 再放宽 15→20: 见下方「等打完回主界面」注释, 每批仍可能多绕一两轮。
    max_visits: 20
    on_fail: {goto: "域外-结束前检测是否已在主界面"}

  - name: 域外-等打完回主界面(最长90分钟)
    # ★ 2026-10-29 事故(账号在 14/50 就收尾): 域外一批 10 场, **场与场之间会短暂
    #   回主界面**(停几秒→自动寻路进下一场), 所以「主界面」单条件每场都成立一次。
    #   旧版 settle:8 只等 8 秒 → 每场都判成"打完了" → 复核 10s 后下一场已开打
    #   (读到「回合」) → goto 守卫 → 再命中 → 每 ~60 秒烧掉一次 max_visits,
    #   6 次 = 6 分钟就把守卫烧穿、在 14/50 处强制收尾。
    #   现在: ① 判据与「批次后」那条统一(主界面 + 非战斗中 + 无回合/逃跑 OCR);
    #         ② settle 8→40 —— 必须连续 40 秒安静才算这一批真打完(场间空窗实测
    #            约 20 秒, 40 秒能跨过去; 一批打完角色会一直停在主界面)。
    #   ⚠ OCR 只在「主界面」模板命中后才跑(all_of 短路), 战斗帧只走模板, 不增开销。
    wait:
      all_of:
        - {ui: 主界面}
        - {not: {ui: 战斗中}}
        - {not: {any: [{ocr: 回合}, {ocr: 逃跑}]}}
    timeout: 5400
    retry: 1
    # 2026-10-19 v4.8.0 (P1-3): 全局 max_step_seconds=1800(30分钟)会把这一步掐死
    # —— 一批额外打十几场本来就要几十分钟, 脚本名也写着"最长90分钟"。这里显式给
    # 自己的整步预算(=单次 timeout), 语义是"我认它要这么久"; 同时 retry:1 不再把
    # 预算放大到 3 小时(旧行为 timeout×2=10800s), 超 90 分钟即交给定 on_fail。
    max_seconds: 5400
    settle: 40
    on_fail: continue

  # 2026-09-23 事故自愈: 批次重开块会在战斗中盲点(506,539), 若战斗恰好
  # 结束, 该点击会把玩法面板打开 —— 面板盖住画面后「主界面」模板时好时坏,
  # 下方 652↔654 循环无出口, 实测空转 8 小时。每轮复核前先关掉可能
  # 开着的面板(面板标题在屏上才点关闭, 防误触)
  - name: 域外-复核前若面板开着则关闭
    optional: true      # 条件探测: 游戏自己决定出不出现, 没有属正常 → 不计入真失败
    wait: {ui: 玩法面板}
    timeout: 3
    retry: 0
    click: [27, 930]
    on_fail: continue

  # 2026-09-29 压缩(用户诉求: 长等待砍到 5-10s): 原 150 秒纯盲等。
  # 这一步真正起作用的不是"睡 150 秒", 而是下面两步复核(主界面 + 无战斗
  # OCR)和主界面模板的 not_screens:[战斗中](09-23 加的第一层修正)。
  # 空睡 150 秒唯一效果是让每轮批次多花 140 秒 → 改 10 秒。
  # 复核不通过依旧跳回 90 分钟长等, 安全性不变(长等本身是条件等待, 一到就返回)。
  - name: 域外-复核停顿10秒(等战斗间隙过去)
    sleep: 10

  - name: 域外-复核是否仍在主界面
    wait: {ui: 主界面}
    timeout: 15
    retry: 1
    on_fail: {goto: "域外-主流程等待守卫"}

  # 2026-10-19 v5.2.0: 与批次后那条同改 —— 加模板快路径 + timeout 3→15。
  # 旧版只有全图 OCR(单帧 5.2s) 且 timeout:3, 只够判 1 帧, 战斗中必然超时;
  # 而它的 on_fail 又 goto 回长等, 两者构成无出口的环。
  - name: 域外-复核是否无战斗
    wait:
      all_of:
        - {not: {ui: 战斗中}}
        # 2026-10-28 修复: 去掉「自动中」—— 域外全程开启自动战斗, 回主界面后
        # 「自动中」HUD 仍挂在屏上, 把它当战斗信号会让本步永远判定"仍战斗中",
        # 反复跳回守卫(max_visits)耗尽 → 没打完就被强制收尾。保留战斗专属信号:
        # 战斗中模板 + 回合/逃跑 OCR(只在战斗中出现, 主界面不会误命中)。
        - {not: {any: [{ocr: 回合}, {ocr: 逃跑}]}}
    timeout: 15
    retry: 0
    on_fail: {goto: "域外-主流程等待守卫"}

  # ---------- 批次循环(2026-09-11 13:10 实测发现) ----------
  # 额外50场不是一次「前往」跑完: 每批约10场, 批结束回主界面就停,
  # 必须重开面板查进度、未满50/50就再点卡→前往。循环终止条件=面板显示50/50。
  #
  # ★ 2026-10-19 v5.2.0 两处加固(11:34~11:48 空转 14 分钟 + 崩溃事故):
  #   ① 面板已经开着时不要再点 (506,539) —— 那一下的语义是"关闭", 会把面板
  #      点掉, 紧接着「批次后等面板出现」必然超时 → 进重开块 → 空转。实测
  #      11:47:12 的画面就是"点前往之后退回面板"(16/50, 面板开着)。
  #   ② 批次入口设次数上限: 正常 50 场约 5~6 批 + 少量重试, 给 8 次; 超限
  #      明确走收尾, 不再无限重试。
  - name: 域外-批次入口-面板已开则跳过点击
    wait: {ui: 玩法面板}
    timeout: 2
    retry: 0
    on_success: {goto: "域外-批次后确认面板已开"}
    on_fail: continue

  - name: 域外-批次结束后重开面板
    click: [506, 539]
    max_visits: 8
    on_fail: {goto: "域外-结束前检测是否已在主界面"}

  - name: 域外-批次后等面板出现
    wait: {ui: 玩法面板}
    timeout: 15  # v5.1.0: 面板有时被战斗/弹窗挡住, 多给几帧
    retry: 2
    # 2026-09-11 16:23 事故修复: 面板开不出来(偶发吞点击)时旧版 continue 空转,
    # 下一步在任务栏误点"域外风情"→失败→静默收尾(域外没跑完却报"成功")。
    # 改为 goto 批次重开块重试开面板
    on_fail: {goto: "域外-批次重开-点按钮(1/2)"}

  # 2026-09-11 16:23: 查次数前先确认面板真的开着(防面板没开时 OCR 在任务栏误匹配)
  - name: 域外-批次后确认面板已开
    wait: {ui: 玩法面板}
    timeout: 3
    retry: 0
    on_fail: {goto: "域外-批次重开-点按钮(1/2)"}

  # 2026-09-23 傍晚: 面板开着时先查「已完成」徽标 —— 任务做完(多倍次数用完)
  # 额外次数可能停在 x/50 不到 50/50, 只认 50/50 会无限批次循环
  # ★ 2026-10-16 用户确认: 这就是本脚本唯一的完成判定权威 —— 面板次数不实时
  #   刷新不可信; 卡片变灰(带「已完成」徽标)=做完, 高亮=还有剩余次数
  # 2026-10-19 v5.2.0: 与其它玩法统一判据 —— pair_min_score 0.62 + pair_min_x 250
  # (真卡名恒在右半区), timeout 4→12(单帧全图 OCR 实测 5.2s, 4s 只够判 1 帧)。
  # 漏了门槛时"沉底卡被气泡压住误读成目标卡名"会假配对(2026-10-08 事故)。
  - name: 域外-批次后查已完成徽标(域外风情)
    wait: {ocr_pair: [已完成, 域外风情], pair_min_score: 0.62, pair_min_x: 250}
    timeout: 12
    retry: 0
    on_success: {goto: "域外-结束前检测是否已在主界面"}
    on_fail: continue

  - name: 域外-批次后查已完成徽标(修罗任务)
    wait: {ocr_pair: [已完成, 修罗任务], pair_min_score: 0.62, pair_min_x: 250}
    timeout: 12
    retry: 0
    on_success: {goto: "域外-结束前检测是否已在主界面"}
    on_fail: continue

  - name: 域外-批次后查已完成徽标(抓鬼任务)
    wait: {ocr_pair: [已完成, 抓鬼任务], pair_min_score: 0.62, pair_min_x: 250}
    timeout: 12
    retry: 0
    on_success: {goto: "域外-结束前检测是否已在主界面"}
    on_fail: continue

  # 2026-10-16: 删掉「域外-查额外次数已满50」(在面板上查 50/50) —— 面板不显示
  # 50/50 且次数不实时刷新, 此步从未命中过, 纯拖慢每轮 5 秒。批次重开块命中后
  # 改为直接跳上方「已完成」徽标检查。

  - name: 域外-未满50再点域外卡片
    optional: true      # 三选一: 本等级只有其中一张卡存在, 找不到另两张属正常(成败由「等介绍页」判定)
    click: {ocr: 域外风情}
    timeout: 8
    retry: 1
    on_fail: continue

  - name: 域外-未满50再点修罗卡片
    optional: true      # 三选一: 本等级只有其中一张卡存在, 找不到另两张属正常(成败由「等介绍页」判定)
    click: {ocr: 修罗任务}
    timeout: 8
    retry: 1
    # 2026-09-11: 加抓鬼后改为 continue, 收尾判定交给抓鬼兜底(低等级号只有抓鬼卡)
    on_fail: continue

  - name: 域外-未满50再点抓鬼卡片
    optional: true      # 三选一: 本等级只有其中一张卡存在, 找不到另两张属正常(成败由「等介绍页」判定)
    click: {ocr: 抓鬼任务}
    timeout: 8
    retry: 1
    # 2026-09-14 事故修复: 改 continue —— 修罗/域外点中后抓鬼必然找不到,
    # 旧版 goto 收尾把"已成功打开介绍页"误判为链失败, 提前结束批次循环
    # (当天修罗 6/50 就收尾的根因)。成功与否统一交给下方「再等介绍页」判定
    on_fail: continue

  - name: 域外-未满50再等介绍页
    wait: {ocr: 任务说明}
    timeout: 8
    retry: 2
    # 2026-10-19 v5.2.0: 旧版 goto 收尾 —— 三张卡都没点中时把"没点开介绍页"当成
    # "已做完"(与 2026-10-19 师门漏做事故同型: 找卡失败被当成已完成静默收尾)。
    # 改为回批次循环重试一次, 由批次入口的 max_visits 兜底, 不会无限转。
    on_fail: {goto: "域外-批次入口-面板已开则跳过点击"}

  # 2026-09-16 同款修复: 批次循环真正的 50/50 判定位置在介绍页(面板上认不出)。
  # 2026-10-16 保留作快速通道: 介绍页的次数是实时准确的, 已满直接收尾,
  # 省得再点前往白等一轮(卡片徽标检查在重开面板时才做, 这里是更早的出口)
  - name: 域外-批次-介绍页查额外次数已满50
    wait: {ocr: 50/50}
    timeout: 5
    retry: 0
    on_success: {goto: "域外-结束前检测是否已在主界面"}
    on_fail: continue

  - name: 域外-未满50再点前往
    click: [350, 795]

  # 2026-10-19 v5.2.0: 120s×3(6 分钟) 太长 —— 正常寻路进战斗 5~30s 就够,
  # 点空了却要白等 6 分钟才降级。改 60s×2 = 2 分钟, 由下方"前往无效"接手。
  - name: 域外-批次后等战斗出现
    wait: {any: [{ocr: 回合}, {ocr: 自动中}, {ocr: 逃跑}]}
    timeout: 60
    retry: 1
    on_fail: continue

  # 2026-09-16 同款加固: 前往没生效直接收尾, 防死等90分钟
  # 2026-10-19 v5.2.0: 实测"点前往无效"的真实表现是**退回玩法面板**(域外 16/50,
  # 面板开着, 见 11:47 现场截图), 而不是"介绍页还开着" —— 旧版只查「任务说明」
  # 完全漏掉这个主场景, 于是继续往下走, 在 934 空等/死循环 14 分钟。
  # 现在两者都算无效, 并回到批次循环重试(由批次入口 max_visits 兜底)。
  - name: 域外-批次后-前往无效则回批次
    wait:
      any:
        - {ocr: 任务说明}
        - {ui: 玩法面板}
    timeout: 8
    retry: 0
    on_success: {goto: "域外-批次入口-面板已开则跳过点击"}
    on_fail: continue

  # 2026-09-23 傍晚同款修复(批次链): 点前往后面板还开着, 必须先关再等
  - name: 域外-批次后-长等前若面板开着则关闭
    optional: true      # 条件探测: 游戏自己决定出不出现, 没有属正常 → 不计入真失败
    wait: {ui: 玩法面板}
    timeout: 3
    retry: 0
    click: [27, 930]
    on_fail: continue

  - name: 域外-批次后-长等前停顿
    sleep: 2

  # ★ 2026-10-19 v5.2.0 防环守卫(必须放在 934 前面, 是环上必经的一步)
  # 环: [等回主界面] → [关面板] → [复核无战斗] → on_fail goto 回 [等回主界面]。
  # 实测 11:34~11:48 在战斗中假阳性后空转 14 分钟(每轮 ~1.5 分钟, 10 轮),
  # 期间每 4~5 秒一次全图 OCR → 最终 access violation 崩溃。
  # 计数到上限就走明确收尾, 绝不允许无限环。max_visits 超限也走 on_fail。
  - name: 域外-批次后等待守卫
    sleep: 0.2
    # 2026-10-28 修复: max_visits 6→15, 理由同「域外-主流程等待守卫」
    # 2026-10-29: 15→20, 与主流程那条保持一致
    max_visits: 20
    on_fail: {goto: "域外-结束前检测是否已在主界面"}

  - name: 域外-批次后等打完回主界面
    wait:
      all_of:
        - {ui: 主界面}
        - {not: {ui: 战斗中}}
        # 2026-10-28 修复: 去掉「自动中」(主界面仍挂自动战斗HUD 会误判), 改用
        # 战斗专属信号; 同时补一层 {not: {ui: 战斗中}} 与「主界面」模板互为冗余。
        - {not: {any: [{ocr: 回合}, {ocr: 逃跑}]}}
    timeout: 5400
    retry: 1
    # 2026-10-19 v4.8.0: 同上, 批次后还有一批, 同样放行 90 分钟。
    max_seconds: 5400
    # 2026-10-16 v3.0.5 加 settle: 战斗→主界面切换时底栏会短暂闪现, 主界面判定
    # (底栏任一 + not战斗中) 瞬间成立, 命中后复核仍成立才成功。
    # 2026-10-19 v5.2.0: 3 秒窗口太窄 —— 域外一批 10 场, 场间回主界面只停几秒
    # 就自动进下一场, 提到 8 秒才真正跨过过渡期。
    # 2026-10-29: 8→40, 与主流程那条统一(8 秒挡不住 20 秒量级的场间空窗)。
    settle: 40
    on_fail: continue

  # 2026-09-23 同款面板自愈(见主流程注释): 批次重开块盲点可能开面板,
  # 不关掉则下面 652↔654 死循环无出口(实测空转 8 小时)
  - name: 域外-批次后-若面板开着则关闭
    optional: true      # 条件探测: 游戏自己决定出不出现, 没有属正常 → 不计入真失败
    wait: {ui: 玩法面板}
    timeout: 3
    retry: 0
    click: [27, 930]
    on_fail: continue

  # 2026-10-16 v3.0.5 改造: 删掉了原先的「复核停顿10秒 + 复核仍主界面(goto回等)」
  # 两步 —— 那个 goto 回跳正是死循环的环。现在"等回主界面"自带 settle 稳检测,
  # 命中即真主界面, 无需再 goto 复核。下面只保留「无战斗」安全闸。
  # 2026-10-19 v5.2.0: 这一步是上面那条环的"环底" ——
  #   ① 判据加模板快路径 {not: {ui: 战斗中}}: battle 模板 20ms 级, 而全图 OCR
  #      单帧实测 5.2s。旧版只有 OCR 且 timeout:3(只够 1 帧), 战斗中必然超时;
  #   ② timeout 3→15 保证至少跑 2~3 帧, 不再"一帧定生死";
  #   ③ on_fail 不再 goto 934(那是环), 改为 goto 守卫 —— 计数达上限即收尾。
  - name: 域外-批次后复核无战斗
    wait:
      all_of:
        - {not: {ui: 战斗中}}
        # 2026-10-28 修复: 去掉「自动中」, 理由同「域外-复核是否无战斗」
        - {not: {any: [{ocr: 回合}, {ocr: 逃跑}]}}
    timeout: 15
    retry: 0
    on_fail: {goto: "域外-批次后等待守卫"}

  - name: 域外-批次后跳回查次数
    jump: 域外-批次结束后重开面板

  # ---------- 批次重开块(仅 on_fail goto 进入, 顺序流不会走到) ----------
  # 2026-09-11 16:23 新增: 批次结束后重开面板偶发被吞点击, 重试 2 次;
  # 2026-10-19 v5.2.0: 仍开不出来时不再 goto 934(那是死循环的环), 改 goto 守卫,
  # 由守卫的 max_visits 兜底 —— 转几轮仍不行就明确收尾, 不再无限空转。
  - name: 域外-批次重开-点按钮(1/2)
    click: [506, 539]

  - name: 域外-批次重开-等出现(1/2)
    wait: {ui: 玩法面板}
    timeout: 10  # v5.1.0: 面板有时被战斗/弹窗挡住, 多给几帧
    retry: 0
    on_success: {goto: "域外-批次后查已完成徽标(域外风情)"}
    on_fail: continue

  - name: 域外-批次重开-点按钮(2/2)
    click: [506, 539]

  - name: 域外-批次重开-等出现(2/2)
    wait: {ui: 玩法面板}
    timeout: 10  # v5.1.0: 面板有时被战斗/弹窗挡住, 多给几帧
    retry: 0
    on_success: {goto: "域外-批次后查已完成徽标(域外风情)"}
    on_fail: {goto: "域外-批次后等待守卫"}

  # ---------- 收尾(面板开着时先关掉) ----------
  - name: 域外-结束前检测是否已在主界面
    wait: {ui: 主界面}
    timeout: 3
    retry: 0
    on_success: {goto: "域外-结束,等回主界面挂机"}
    # loop 展开后循环名不是步骤名, 跳循环首轮子步骤(名字带 (1/6) 后缀)
    on_fail: {goto: "域外-结束-若在主界面则通过(1/6)"}

  # 2026-09-14: 改逃逸循环 —— 旧版只点一次关面板, 介绍页开着时点(22,916)
  # 只是"介绍页→玩法面板", 面板仍开着, 后面等主界面 3×15s 必然失败,
  # 残留面板一直挂到手动处理。改为主界面判定驱动的循环, 最多 6 轮
  - name: 域外-结束逃逸循环
    loop: 6
    steps:
      - name: 域外-结束-若在主界面则通过
        wait: {ui: 主界面}
        timeout: 3
        retry: 0
        on_success: {goto: "域外-结束已回主界面"}
        on_fail: continue

      - name: 域外-结束-点左下角返回
        click: [25, 922]
        on_fail: continue

      - name: 域外-结束-停顿
        sleep: 1

  - name: 域外-结束已回主界面
    sleep: 1

  - name: 域外-结束逃逸-跳挂机等待
    jump: 域外-结束,等回主界面挂机

  - name: 域外-结束,等回主界面挂机
    wait: {ui: 主界面}
    timeout: 180
    on_fail: continue

  # 跳板: 主流程走到这里必须跳过下方恢复块, 否则会误点卡片重开域外
  # 2026-10-18 v4.4.0: 跳板改指向收尾验收块(验完再跳脚本结束)
  - name: 域外-主流程结束跳板
    jump: 域外验收-打开玩法面板

  # 2026-10-18 v4.4.0 (P0-2): 收尾验收 —— 域外风情卡做完后也挂「已完成」徽标
  # (2026-10-18 账号1 实测: 10/10 时徽标在; 早前"域外无徽标"是因为当时 0/50 没做完)。
  # 卡片在列表第 3 位, 回顶后整卡可见, 与地煞同模板。
  - name: 域外验收-打开玩法面板
    click: [506, 539]
    timeout: 5
    retry: 1
    on_fail: continue

  - name: 域外验收-等面板出现
    wait: {ui: 玩法面板}
    timeout: 15  # v5.1.0: 面板有时被战斗/弹窗挡住, 多给几帧
    retry: 1
    on_fail: continue

  - name: 域外验收-点日常页签
    click: [95, 934]
    on_fail: continue

  - name: 域外验收-列表回顶
    swipe: {from: [270, 320], to: [270, 860], duration: 200}
    on_fail: continue

  - name: 域外验收-回顶停顿
    sleep: 1

  - name: 域外验收-看已完成徽标
    wait: {ocr_pair: [已完成, 域外风情], pair_min_score: 0.62, pair_min_x: 250}
    timeout: 12  # v5.1.0: 单帧≈截图0.8s+全图OCR5.2s, 5s 只够判 1 帧
    retry: 0
    verify_done: true
    on_success: {goto: 域外验收-检测面板是否开着}
    on_fail: continue

  # 面板动画/OCR 抖动会误判(师门 2026-09-11 事故), 停 3 秒复核一次
  - name: 域外验收-复核停顿
    sleep: 3

  - name: 域外验收-复核徽标
    wait: {ocr_pair: [已完成, 域外风情], pair_min_score: 0.62, pair_min_x: 250}
    timeout: 12  # v5.1.0: 单帧≈截图0.8s+全图OCR5.2s, 5s 只够判 1 帧
    retry: 0
    verify_done: true
    # 复核步=同卡二次确认, OR 合并(检查✘→复核✔ 仍算完成)
    verify_retry: true
    on_fail: continue

  - name: 域外验收-检测面板是否开着
    wait: {ui: 玩法面板}
    timeout: 3
    retry: 0
    on_fail: {goto: 域外验收-等回主界面}

  - name: 域外验收-关面板
    click: [22, 916]
    on_fail: continue

  - name: 域外验收-等回主界面
    wait: {ui: 主界面}
    timeout: 10
    on_fail: continue

  - name: 域外验收-跳脚本结束
    jump: 域外-脚本结束

  # ---------- 面板重开块(仅 on_fail goto 进入, 顺序流不会走到) ----------
  # 2026-09-11 11:48 事故新增: 主界面点玩法按钮偶发被吞, 旧版干等后整段空转。
  # 重试点击2次, 仍开不出来只能放弃本段(跳脚本结束, 不误点卡片)
  - name: 域外-面板重开-点玩法按钮(1/2)
    click: [506, 539]

  - name: 域外-面板重开-等出现(1/2)
    wait: {ui: 玩法面板}
    timeout: 5
    retry: 0
    on_success: {goto: "域外-点日常页签(确保在正确页签)"}
    on_fail: continue

  - name: 域外-面板重开-点玩法按钮(2/2)
    click: [506, 539]

  - name: 域外-面板重开-等出现(2/2)
    wait: {ui: 玩法面板}
    timeout: 5
    retry: 0
    on_success: {goto: "域外-点日常页签(确保在正确页签)"}
    on_fail: {goto: "域外-脚本结束"}

  # ---------- 找卡/介绍页恢复块(仅 on_fail goto 进入, 顺序流不会走到) ----------
  # 2026-09-11 新增: 找不到卡片或介绍页时不许裸奔终止全家桶(与师门/五环同款)
  # 2026-09-11 11:48 事故加固: 恢复块必须先确保玩法面板真的开着 ——
  # 面板没开时在这里拉回顶部/找卡全是空转(本次域外整段静默跳过的根因)
  - name: 域外-恢复-若面板已开则直接找卡
    wait: {ui: 玩法面板}
    timeout: 3
    retry: 0
    on_success: {goto: "域外-找卡恢复-拉回顶部(1/2)"}
    on_fail: continue

  - name: 域外-恢复-点玩法按钮(1/2)
    click: [506, 539]

  - name: 域外-恢复-等面板出现(1/2)
    wait: {ui: 玩法面板}
    timeout: 5
    retry: 0
    on_success: {goto: "域外-找卡恢复-拉回顶部(1/2)"}
    on_fail: continue

  - name: 域外-恢复-点玩法按钮(2/2)
    click: [506, 539]

  - name: 域外-恢复-等面板出现(2/2)
    wait: {ui: 玩法面板}
    timeout: 5
    retry: 0
    on_success: {goto: "域外-找卡恢复-拉回顶部(1/2)"}
    on_fail: {goto: "域外-找卡恢复-关面板收尾"}

  - name: 域外-找卡恢复-拉回顶部(1/2)
    swipe: {from: [270, 320], to: [270, 860], duration: 200}

  - name: 域外-找卡恢复-停顿1
    sleep: 1

  - name: 域外-找卡恢复-拉回顶部(2/2)
    swipe: {from: [270, 320], to: [270, 860], duration: 200}

  - name: 域外-找卡恢复-停顿2
    sleep: 1

  - name: 域外-找卡恢复-再点域外卡片
    optional: true      # 三选一: 本等级只有其中一张卡存在, 找不到另两张属正常(成败由「等介绍页」判定)
    click: {ocr: 域外风情}
    timeout: 8
    retry: 1
    on_fail: continue

  - name: 域外-找卡恢复-再点修罗卡片
    optional: true      # 三选一: 本等级只有其中一张卡存在, 找不到另两张属正常(成败由「等介绍页」判定)
    click: {ocr: 修罗任务}
    timeout: 8
    retry: 1
    # 2026-09-11: 加抓鬼后改为 continue, 收尾判定交给抓鬼兜底
    on_fail: continue

  - name: 域外-找卡恢复-再点抓鬼卡片
    optional: true      # 三选一: 本等级只有其中一张卡存在, 找不到另两张属正常(成败由「等介绍页」判定)
    click: {ocr: 抓鬼任务}
    timeout: 8
    retry: 1
    # 2026-09-14 同款修复: 改 continue, 判定权交给下方「等介绍页确认」
    on_fail: continue

  - name: 域外-找卡恢复-等介绍页确认
    wait: {ocr: 任务说明}
    timeout: 8
    retry: 1
    on_fail: {goto: "域外-找卡恢复-关面板收尾"}

  - name: 域外-找卡恢复-成功跳回流程
    jump: 域外-若弹离线完成提示则点继续进行

  # 2026-09-11 加固: 关面板前先检测 —— 已在主界面时点左下角会误入练功区!
  - name: 域外-找卡恢复-关面板收尾
    wait: {ui: 主界面}
    timeout: 3
    retry: 0
    on_success: {goto: "域外-脚本结束"}
    on_fail: continue

  - name: 域外-找卡恢复-关面板点击
    click: [22, 916]
    on_fail: continue

  - name: 域外-找卡恢复-关面板停顿
    sleep: 1

  - name: 域外-找卡恢复-关面板后等主界面
    wait: {ui: 主界面}
    timeout: 15
    retry: 2
    on_fail: continue

  - name: 域外-脚本结束
    sleep: 1
