# -*- coding: utf-8 -*-
# ============================================================
# 领取离线奖励 —— 2026-09-09 实测(6个奖励全部领取成功)
# ------------------------------------------------------------
# 适用场景: 固定队队友完成了日常/地煞,本账号离线躺赢,
#           玩法面板任务卡片中央出现发光宝箱 + "离线期间XX带你完成了N次XX"
#
# 核心思路(2026-09-11 用户建议):
#   「一直点最上边的宝箱」—— 可领宝箱永远排在面板列表最上方,
#   领掉一个后该卡从列表移除, 后面的卡自动上移, 所以循环点同一个位置
#   就能把所有离线完成的奖励(日常一条 N 个 + 地煞等)全部领完。
#   都领完后再由后续各段自行判定「还剩什么任务没做」。
#
# 实测规律(2026-09-11 新号复测后更新):
#   - 最上方宝箱(第一张卡中央)约 (305,160); 旧坐标 270,175 偏到
#     宝箱左下边缘外, 点不中就误判"领完了", 导致只领到 1 个
#   - 确认框「确认领取」(311,618)、「等等再说」(119,620)
#   - 领取后右下角会弹「活动道具」提示窗(自动消失, 不挡宝箱点击)
#   - 全部领完后无弹窗(点击会落到下一张卡上打开介绍页) → goto 收尾
#   - 点击偶发被游戏吞掉(已多次证实), 故单次无弹窗先去补点复核一次,
#     补点仍无弹窗才判定"没有可领的了"
#
# 收尾: 左下返回箭头 (27,930) 一击关介绍页+面板 → 等回主界面(失败再补一次)
#       (2026-09-10 修复: 老坐标关不掉面板,无可领时整条链路卡死)
# ============================================================
name: 领取离线奖励
description: 玩法面板循环点最上方宝箱领离线完成的玩法奖励,领完自动收尾回主界面

settings:
  default_timeout: 10
  default_retry: 2

steps:
  - name: 确认主界面
    wait: {ui: 主界面}
    timeout: 10
    retry: 3
    # 2026-09-11: 不硬终止 —— 上段若遗留浮层, 本段随后会自己重开面板导航
    on_fail: continue

  - name: 打开玩法面板
    click: [506, 539]

  - name: 等玩法面板出现
    wait: {ui: 玩法面板}
    timeout: 10
    retry: 3
    # 2026-09-11: 面板开不出来不硬终止, 后续OCR找卡有恢复块兜底
    on_fail: continue

  # 一直点最上方的宝箱: 领一个, 下面的上移, 继续点同一个位置
  # 上限 15 —— 离线完成的任务可能较多(日常一条5子任务 + 地煞 + 师门/五环等)
  - name: 领取循环(最多15个)
    loop: 15
    steps:
      - name: 点最上方宝箱
        click: [305, 160]

      # retry:0 —— 点完没弹窗先别收尾, 去补点一次(防点击偶发被吞)
      - name: 等确认弹窗出现
        wait: {ocr: 确认领取}
        timeout: 12
        retry: 0
        on_fail: {goto: 领奖-补点-再点宝箱}

      - name: 点确认领取
        click: [311, 618]

      - name: 等列表上移
        sleep: 2

  # 跳板: 循环正常跑完(15个都领到)直接去收尾, 不进入下方补点复核块
  - name: 领奖-循环结束跳板
    jump: 领取完成收尾

  # ---------- 补点复核块(仅 on_fail goto 进入, 顺序流不会走到) ----------
  # 2026-09-11: 点击偶发被游戏吞掉(已多次证实), 单次无弹窗不代表领完。
  # 补点一次仍无弹窗才判定"没有可领的了"; 补点成功说明是抖动, 回循环首轮继续领。
  - name: 领奖-补点-再点宝箱
    click: [305, 160]

  - name: 领奖-补点-等确认弹窗
    wait: {ocr: 确认领取}
    timeout: 10
    retry: 0
    on_fail: {goto: 领取完成收尾}

  - name: 领奖-补点-点确认领取
    click: [311, 618]

  - name: 领奖-补点-等列表上移
    sleep: 2

  - name: 领奖-补点-成功回循环
    jump: 点最上方宝箱(1/15)

  - name: 领取完成收尾
    sleep: 1

  # 说明: 无可领宝箱时点击会打开卡片介绍页(此时X坐标也不是487,133),
  #       2026-09-10 实测: 左下角返回箭头 (27,930) 一击可同时关掉介绍页+面板
  #       (老坐标 22,916 偏上14px 点不中,导致卡死,勿改回)
  - name: 点返回箭头关面板(介绍页一并退出)
    click: [27, 930]

  - name: 停顿2秒
    sleep: 1

  - name: 等回主界面
    wait: {ui: 主界面}
    timeout: 10
    retry: 1
    on_fail: {goto: 再点返回箭头}

  # 成功路径必须 jump 走,否则会滑到“再点返回箭头”在主界面乱点
  - name: 已回主界面:跳过兜底
    jump: 最终确认主界面

  - name: 再点返回箭头
    click: [27, 930]

  - name: 停顿2秒
    sleep: 1

  - name: 最终确认主界面
    wait: {ui: 主界面}
    timeout: 15
    retry: 2
    on_fail: continue
