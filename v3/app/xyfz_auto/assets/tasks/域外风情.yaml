# -*- coding: utf-8 -*-
# ============================================================
# 域外风情(额外50次) —— 独立脚本 (2026-10-10 从「日常全家桶」拆出)
# ------------------------------------------------------------
# 单独跑域外风情: 玩法面板 OCR 定位卡片 → 介绍页前往 → 托管连打 →
# 循环清理结算弹窗 → 长等主界面。
#
# 注意:
#   - 这是**额外 50 次**的独立玩法, 与「组队一条」里跑的域外是两回事,
#     可以分开跑, 也可以同一天都跑
#   - 连打耗时长, 收尾是"长等主界面", 别以为卡住了
#
# 与总脚本的关系:
#   - 内容不复制 —— 用 include 引用 parts/daily_yuwai.yaml, 共用同一份
#   - 本文件放在 tasks/ 顶层, GUI「任务脚本」下拉里可直接选中单独运行
#
# 关于开头的纯享模式:
#   - 纯享隐藏其他玩家模型和称谓, 画面干净可显著减少模板/OCR 误判;
#     点击幂等(已开启再点无副作用)。不需要就删掉 ⓪ 那一步
# ============================================================
name: 域外风情(额外50次)
description: "玩法面板 OCR 定位域外风情卡 → 前往 → 托管连打 → 循环清理结算弹窗"

settings:
  default_timeout: 30
  default_retry: 2

steps:
  - name: "⓪开启纯享模式"
    include: parts/daily_pure_mode.yaml

  - name: "①域外风情额外50次"
    include: parts/daily_yuwai.yaml
