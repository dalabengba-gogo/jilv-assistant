# -*- coding: utf-8 -*-
# ============================================================
# 五环 + 师门 —— 独立脚本 (2026-10-10 从「日常全家桶」拆出)
# ------------------------------------------------------------
# 把两个单人日常(五环任务、师门任务)合成一个脚本, 一次跑完。
#
# 顺序说明:
#   - 本脚本按「五环 → 师门」执行; 总脚本 daily_all.yaml 里是「师门 → 五环」
#   - 两者都是单人玩法、互不依赖, 顺序不影响结果; 想反过来只需把下面
#     ① ② 两步的位置对调(**对应的 include 行一起动**, 别只改名字)
#
# 与总脚本的关系:
#   - 内容不复制 —— 用 include 引用 parts/ 下的两个子脚本, 共用同一份
#   - 本文件放在 tasks/ 顶层, GUI「任务脚本」下拉里可直接选中单独运行
#
# 关于开头的纯享模式:
#   - 纯享隐藏其他玩家模型和称谓, 画面干净可显著减少模板/OCR 误判;
#     点击幂等(已开启再点无副作用)。不需要就删掉 ⓪ 那一步
# ============================================================
name: 五环+师门
description: "两个单人日常合跑: 五环任务 → 师门任务(玩法面板 OCR 定位卡片, 全自动)"

settings:
  default_timeout: 30
  default_retry: 2

steps:
  # ============================================================
  # ⓪-1 进入守卫 (2026-10-26 v6.1.4 新增) —— **必须在离队段之前**
  # ------------------------------------------------------------
  # 10-26 事故(账号2/3/4/5 四开同时启动): 屏幕上还挂着日常一条龙的
  # 「恭喜获得 / 恭喜完成了今日挖宝封妖」奖励结算串, 而离队段是脚本第一步,
  # 于是:
  #   ① 「打开固定队面板」click[500,684] 打在弹窗上 → 面板没开;
  #   ② 「切到队伍页签」也打在弹窗上;
  #   ③ 「若不在队伍则跳过」判不到「离队」→ 判定"不在队伍"→ 整段跳过;
  #   ④ 人还在队里 → 五环「前往」/师门「选师傅」被游戏静默拒绝 → 0/5。
  # 之前守卫只存在于纯享段和五环/师门各自的头部, 都排在离队段之后,
  # 救不了离队段。现在把同款守卫提到**整个脚本最前面**。
  # ============================================================
  - name: 五环师门-进入守卫-循环
    loop: 8
    steps:
      - name: 五环师门-进入守卫-无奖励弹窗则通过
        wait: {ui: 奖励结算弹窗}
        timeout: 2
        retry: 0
        on_fail: {goto: 五环师门-进入守卫-完成}

      - name: 五环师门-进入守卫-点任务栏翻过奖励页
        click: [270, 905]

      - name: 五环师门-进入守卫-停顿2秒
        sleep: 2

  - name: 五环师门-进入守卫-完成
    sleep: 1

  # ============================================================
  # ⓪-2 离队 (2026-10-23 v6.1.2 新增, 用户指定)
  # ------------------------------------------------------------
  # 五环/师门都是**单人玩法**。角色还留在队伍里(固定队已自动组队)时,
  # 玩法介绍页的「前往」和师门「选师傅」按钮会被游戏**静默拒绝**——
  # 点下去页面纹丝不动, 脚本判「前往未生效 / 介绍页没关」→ 整段跳过收尾,
  # 五环/师门当天 0/5 却看着"任务成功"。
  #
  # 注意: **固定队和队伍是两套逻辑** —— 固定队是常驻组织, 「队伍」才是当前
  # 这一支队伍; 固定队面板里的「离队」是退出固定队, 不是要的那个。
  # 要退当前队伍: 主界面右下「固定队」→ 面板底部「队伍」页签 → 右上「离队」。
  # (不在队伍时同一个「队伍」页签进的是组队大厅, 没有「离队」, 本段自动跳过)
  #
  # 2026-10-26 实测确认(账号2):
  #   - 主界面「固定队」入口 [500,684] 有效; 底部「队伍」页签 [493,944] 有效;
  #   - 队伍界面右上「离队」中心经 OCR 实测 = (470,80);
  #   - 点「离队」**没有二次确认**, 界面直接回主界面(所以收尾要先判主界面)。
  # ============================================================
  - name: 五环师门-离队-打开固定队面板
    click: [500, 684]
    on_fail: continue

  - name: 五环师门-离队-停顿等面板
    sleep: 4

  # 2026-10-26 二次修正(账号2/3/5 又失败): 固定队首页会挂「双曜祈愿」广告位,
  # 广告在时整页布局下移 —— 底部「战队/固定队/队伍」页签栏从 y=943 掉到 y≈952,
  # 且首页还会浮出游戏自带工具栏(安全锁/录屏/纯享…)压在 y≈930 一带。
  # 于是单击一次 (493,944) 会打偏在工具栏/空隙上 → 页签没切过去。
  # 现在点两次不同 y, 每次点完都判一次「目标」, 命中就走。
  - name: 五环师门-离队-切到队伍页签
    click: [493, 944]
    on_fail: continue

  - name: 五环师门-离队-停顿等队伍界面
    sleep: 2

  # 2026-10-26 判据修正: 原来用「离队」判断"是否在队伍", 但**固定队面板里
  # 也有一处「离队」(OCR 中心 353,506)**, 页签没切过去时会误判"在队伍里",
  # 接着点「离队」就变成了**退出固定队**(不是要的结果)。
  # 队伍界面左上角有「目标：无」, 固定队面板没有 → 只有它能区分两者。
  # 命中 = 已经在队伍界面 → 直接去点离队; 未命中 = 页签可能没切过去 → 换 y 再点一次。
  - name: 五环师门-离队-若不在队伍则跳过
    wait: {ocr: 目标}
    timeout: 3
    retry: 0
    on_success: {goto: 五环师门-离队-点离队}
    on_fail: continue

  - name: 五环师门-离队-切到队伍页签-备选
    click: [491, 952]
    on_fail: continue

  - name: 五环师门-离队-停顿等队伍界面-备选
    sleep: 2

  - name: 五环师门-离队-若不在队伍则跳过-备选
    wait: {ocr: 目标}
    timeout: 4
    retry: 0
    on_fail: {goto: 五环师门-离队-收尾}

  - name: 五环师门-离队-点离队
    # 用固定坐标而不是 click:{ocr:离队}: 万一判据误命中, 固定坐标最坏是点空,
    # 而 OCR 定位在固定队面板会点中"退固定队"(破坏性)。
    click: [470, 80]
    on_fail: continue

  - name: 五环师门-离队-停顿
    sleep: 2

  # 实测: 点离队后界面直接回主界面 → 已在主界面就不要再点返回箭头
  # (纯享段踩过: 主界面左下 [25,922] 会打开聊天/频道面板)
  - name: 五环师门-离队-收尾
    wait: {ui: 主界面}
    timeout: 5
    retry: 0
    on_success: {goto: 五环师门-离队-完成}
    # ★ 2026-10-26 致命遗漏: 这步只写了 on_success, 没有 on_fail →
    #   不在队伍时「队伍」页签进的是**组队大厅**, 必然判不到主界面 →
    #   引擎报"重试耗尽且未配置 on_fail 兜底" → **整条任务被终止**
    #   (账号2/3/5 10:57 那一轮就是这么挂在第 33 步的, 五环/师门一步没跑)。
    on_fail: continue

  - name: 五环师门-离队-关面板回主界面
    click: [25, 922]
    on_fail: continue

  - name: 五环师门-离队-停顿回主界面
    sleep: 2

  - name: 五环师门-离队-完成
    wait: {ui: 主界面}
    timeout: 6
    retry: 1
    # 离不掉也不硬终止: 后面五环/师门自己的「前往是否生效」会兜底收尾
    on_fail: continue

  - name: "⓪开启纯享模式"
    include: parts/daily_pure_mode.yaml

  - name: "①五环任务"
    include: parts/daily_wuhuan.yaml

  - name: "②师门任务"
    include: parts/daily_shimen.yaml
