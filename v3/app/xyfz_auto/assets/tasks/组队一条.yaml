# -*- coding: utf-8 -*-
# ============================================================
# 组队一条 —— 独立脚本 (2026-10-10 从「日常全家桶」拆出)
# ------------------------------------------------------------
# 单独跑组队一条(固定队一条龙: 创建/邀请 → 抓鬼/挖宝/烧法/商旅/帮派 → 清结算弹窗)。
#
# 与总脚本的关系:
#   - 内容不复制 —— 用 include 引用 parts/daily_team_oneloop.yaml, 与
#     daily_all.yaml 共用同一份, 改一处两边都生效
#   - 本文件放在 tasks/ 顶层, 所以 GUI「任务脚本」下拉里能直接选中单独运行
#     (parts/ 与 tests/ 里的不会出现在下拉里)
#
# 关于开头的纯享模式:
#   - 纯享隐藏其他玩家模型和称谓, 画面干净可显著减少模板/OCR 误判;
#     点击幂等(已开启再点无副作用), 所以无条件开一次
#   - 不需要就删掉下面「⓪开启纯享模式」那一步, 不影响后续
# ============================================================
name: 组队一条
description: "固定队一条龙: 组队→抓鬼/挖宝/烧法/商旅/帮派→自动清理结算弹窗"

settings:
  default_timeout: 30
  default_retry: 2

steps:
  - name: "⓪开启纯享模式"
    include: parts/daily_pure_mode.yaml

  - name: "①组队一条"
    include: parts/daily_team_oneloop.yaml
