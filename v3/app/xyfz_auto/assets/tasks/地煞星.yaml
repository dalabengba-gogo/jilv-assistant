# -*- coding: utf-8 -*-
# ============================================================
# 地煞星×3 —— 独立脚本 (2026-10-10 从「日常全家桶」拆出)
# ------------------------------------------------------------
# 单独挑战地煞星 3 次(默认 10 星地藏星)。
#
# 脚本选项:
#   - 「挑战星级」在 GUI「脚本选项」页可调(自动 / 第 1~4 行),
#     选项声明写在 parts/daily_dixia_3x.yaml 的 options: 段里 ——
#     include 进来的脚本, 选项会自动出现在界面上, 不用改 GUI 代码
#
# 组队说明:
#   - 子脚本自带前置组队并容错(已有队伍则跳过组队), 所以单独跑也能成立,
#     不依赖先跑「组队一条」
#
# 与总脚本的关系:
#   - 内容不复制 —— 用 include 引用 parts/daily_dixia_3x.yaml, 共用同一份
#   - 本文件放在 tasks/ 顶层, GUI「任务脚本」下拉里可直接选中单独运行
#
# 关于开头的纯享模式:
#   - 纯享隐藏其他玩家模型和称谓, 画面干净可显著减少模板/OCR 误判;
#     点击幂等(已开启再点无副作用)。不需要就删掉 ⓪ 那一步
# ============================================================
name: 地煞星×3
description: "挑战地煞星 3 次(星级可在「脚本选项」页调整), 自带前置组队容错"

settings:
  default_timeout: 30
  default_retry: 2

steps:
  - name: "⓪开启纯享模式"
    include: parts/daily_pure_mode.yaml

  - name: "①地煞星×3"
    include: parts/daily_dixia_3x.yaml
