# -*- coding: utf-8 -*-
# ============================================================
# 领取离线奖励 —— 独立脚本 (2026-10-26 从「日常全家桶」拆出)
# ------------------------------------------------------------
# 场景: 固定队队友把日常/地煞跑完了, 本账号离线躺赢 →
#       玩法面板对应卡片中央出现发光宝箱 + "离线期间XX带你完成了N次XX"
#
# 做法(2026-09-11 用户建议, 已实测):
#   「一直点最上边的宝箱」—— 可领宝箱永远排在面板列表最上方,
#   领掉一个后该卡从列表移除、后面的卡自动上移, 所以循环点同一个位置
#   就能把所有离线完成的奖励(日常一条 N 个 + 地煞等)全部领完。
#
# 什么时候单独跑:
#   - 队友已经跑完, 你只想把奖励点掉(几十秒, 不用等整条一条龙)
#   - 主脚本中途被打断, 想补领漏下的离线奖励
#
# 与总脚本的关系:
#   - **内容不复制** —— include 引用 parts/daily_claim.yaml, 与
#     daily_all.yaml 共用同一份子脚本, 改一处两边同时生效
#   - 本文件放在 tasks/ 顶层, GUI「任务脚本」下拉里可直接选中单独运行
#
# 关于纯享模式:
#   - 本脚本**不加**纯享前置 —— 领宝箱只在玩法面板里点固定坐标,
#     不依赖画面干净(纯享要额外走开菜单/点面板一串点击, 对本任务纯属风险)
# ============================================================
name: 领取离线奖励
description: "玩法面板循环点最上方宝箱, 领完离线期间队友帮你完成的玩法奖励, 领完自动回主界面"

settings:
  default_timeout: 30
  default_retry: 2

steps:
  # ============================================================
  # ⓪ 进入守卫 (v6.1.1 同款) —— 日常一条龙的「恭喜获得」奖励结算串是
  #   半透明遮罩: 底栏图标透出来 → 主界面判定会误成立, 而 key:4(返回键)
  #   实测不仅关不掉, 反而弹「确认要退出?」。正确关法 = 点**底栏中下部
  #   任务栏区域** [270,905], 每点一次翻过一页奖励, 全部翻完自动回主界面。
  #   不用左下角返回箭头 [27,913](会跳到离线挂机界面)。
  # ============================================================
  - name: 离线-守卫-循环
    loop: 8
    steps:
      - name: 离线-守卫-无奖励弹窗则通过
        wait: {ui: 奖励结算弹窗}
        timeout: 2
        retry: 0
        on_fail: {goto: 离线-守卫-完成}

      - name: 离线-守卫-点任务栏翻过奖励页
        click: [270, 905]

      - name: 离线-守卫-停顿2秒
        sleep: 2

  - name: 离线-守卫-完成
    sleep: 1

  # ============================================================
  # ① 领取离线奖励 (共用 parts/daily_claim.yaml)
  # ============================================================
  - name: "①领取离线奖励"
    include: parts/daily_claim.yaml

  # 子脚本自身已「关面板 → 等回主界面 → 兜底再点一次」收尾,
  # 这里再确认一遍, 避免单独运行时停在某个浮层上
  - name: 离线-收尾-确认主界面
    wait: {ui: 主界面}
    timeout: 15
    retry: 2
    on_fail: continue
