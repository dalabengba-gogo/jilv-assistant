# ============================================================
# 大话西游自动助手 xyfz_auto 配置文件
# ============================================================

device:
  # adb 路径。填 "auto" 表示自动查找，顺序为：
  #   1) 若本项填了真实存在的路径，优先用它
  #   2) 包内自带 tools/adb/adb.exe   ← 便携版推荐，换机器无需改配置
  #   3) 系统 PATH 里的 adb
  #   4) MuMu 常见安装位置（自动扫描 C/D/E 等各盘符）
  # 若 MuMu 装在非默认目录，直接写全路径，例如 "D:/MuMu/nx_main/adb.exe"
  adb_path: "auto"
  host: "127.0.0.1"
  port: 16384          # MuMu ADB 调试端口（已开启）
  # 2026-10-16 v3.0.0: 删掉了 screen_size / density 两个键 —— 全项目代码零读取
  # (grep '"density"' 在 .py 里 0 命中), 留着只会误导后来者以为改它有用。
  # 真要做分辨率换算请用截图实际尺寸, 别依赖这里的声明值。

recognition:
  template_dir: "assets/templates"   # 模板图库目录
  # 2026-10-19 v4.9.0: 这里是**全局兜底**阈值, 不再是唯一开关。
  #   模板之间差别很大: 纯文字/单色按钮往往要 0.90 才算真命中, 带动态角标或
  #   半透明底的模板天生只能到 0.78 —— 一个全局值必然两头不讨好。
  #   逐模板调:  assets/templates/_meta.txt    (模板名 = 0.88)
  #   逐步骤调:  脚本里加 threshold: 0.92      (优先级最高)
  #   优先级: 脚本 > _meta.txt > 本行。改完跑 scripts\check_refs.py 验一遍。
  match_threshold: 0.80              # 模板匹配相似度阈值(全局兜底)
  ocr_engine: "rapidocr"             # 预留：rapidocr / paddle

engine:
  tasks_dir: "assets/tasks"          # 任务脚本目录
  default_timeout: 30                # 每步默认超时(秒)
  # 2026-10-19 v5.5.0(性能): 1.0 → 0.3。
  # 一次轮询本身就要 2.8 秒(截图 0.86 + 全图 OCR 1.97), 再睡满 1 秒等于多付 26%
  # 的空转 —— 而且等待窗口内能看的帧数变少, 「差半秒就刷出来」的画面会被判超时。
  # 降到 0.3 秒: 同一段 timeout 里多看 20~30% 的帧, 命中更快、假超时更少。
  # 想省 CPU 可以调回 1.0, 代价就是慢。
  poll_interval: 0.3
  # 2026-10-16 v3.0.4: goto 死循环保护上限。某步骤 on_fail:{goto:X} 反复跳回同一目标
  # 超过该次数即判定疑似死循环并终止任务(默认 30)。正常等待请用 wait 超时,
  # 不要靠 goto 空转; 若 legit 脚本确实需要更长等待可在此调大。
  # 2026-10-19 v5.2.0: 30 → 12。实测域外 934↔936 那个环每轮约 40 秒, 30 轮要
  #   20 分钟才触发 —— 11:34~11:48 空转 14 分钟正好死在触发之前, 还把全图 OCR
  #   压到进程崩溃(access violation)。v3.5.0 起这里只统计 **失败回跳**, 合法长循环
  #   (每日必领 15 次宝箱等 on_success/jump 回边)不计数, 所以降到 12 是安全的。
  goto_loop_limit: 12
  # 2026-10-16 v3.0.0: 删掉 retry_times(代码零读取)。步骤重试次数由脚本自己的
  # retry: 字段决定, loader 里的 default_retry 才是真正的默认值。

  # 2026-10-17 v3.5.0: 单个步骤的**总时间预算**上限(秒), 0 = 不额外限制
  # (即 timeout × (retry+1), 例如 timeout:5400 + retry:1 = 单步最坏 3 小时)。
  # 填了它, 整步(含每次重试、含 settle 稳检测的复核循环)共享这份预算,
  # 用尽即判该步超时 —— 这是"一跑 4 小时"的直接解药。
  # ⚠️ 别设太小: 域外/一条龙这类"等一场战斗打完"的步骤本身就要几分钟到几十分钟,
  #    它们已经在脚本里用 **max_seconds** 单独开口子(见下面 v4.8.0 说明),
  #    全局值只管其余所有步骤 —— 实测全项目 timeout≥600 的只有 4 步, 都标注了。
  # 2026-10-19 v4.8.0 (P1-3): 正式启用(此前一直是注释着的 0)。取 1800 = 30 分钟,
  #   足够任何一次正常等待; 再久就说明某一步卡住了, 该交给定 on_fail 兜底而不是干等。
  max_step_seconds: 1800

  # 2026-10-19 v4.8.0: **per-step 放行**。某个步驟写 max_seconds: N 即拥有自己的
  # 整步预算 N 秒(覆盖上面的全局值), 用于「等打完回主界面」这类天生要久等的步骤。
  #   已标注: 域外-等打完回主界面 / 域外-批次后等打完回主界面 (各 5400s),
  #           一条龙-结束等回主界面挂机 (3600s)。其余步骤一律吃全局 1800s。

  # 2026-10-19 v4.8.0: 验收点(verify_done / verify_retry)的判定下限。
  #   背景: 脚本里验收点写的是 timeout: 3~5 + retry: 0, 而**实测一轮判定要 6 秒**
  #   (2026-10-19 账号2 真机: adb 截图 0.80s + 全图 OCR 5.22s, 45 个文本块) ——
  #   3~5 秒只够看一帧就宣判"面板上没有已完成徽标", 刚渲染完/列表还在滑的都被读成
  #   "没有", 把已经做成的玩法报成未完成。这一判定是"以游戏面板为准"的权威口径,
  #   宁可多等几秒也不能草率。15 秒 ≈ 2.5 轮完整识别, 配上 retry 1 最坏可看 5 帧。
  #   ⚠️ 别调小到 10 以下 —— 一轮就要 6 秒, 低于 12 秒等于仍然只看一两帧。
  #   只作用于验收点/复核步(全项目十来处), 普通步骤完全不受影响; 填 0 可整体关掉。
  verify_min_seconds: 15
  verify_min_retry: 1

  # 2026-10-17 v3.5.0: 失败现场截图(logs/debug*)的滚动清理。
  # 以前只增不减 —— 实测一晚 157 张 / 134MB 永久常驻, 跑几晚就把便携版撑到几百 MB,
  # 外发或「导出诊断信息」时还会把游戏截图一起带出去。0 = 该条规则不生效(两条都不
  # 填 = 退回旧行为, 不清理)。
  # 2026-10-18 v4.6.0: 200 → 120。配合下方失败截图改 JPEG —— 三条真实截图实测
  # 431/682/1061 KB 的 PNG 压成 43/99/159 KB(合计省 86%)。同一个端口目录按
  # 120 张配额算: 约 85 MB → 约 12 MB。够排查最近两三次失败, 又不堆积。
  debug_keep_max: 120
  debug_keep_days: 7

  # 2026-10-18 v4.6.0 (P0-4): **文本日志**滚动(logs/run_<port>.log)。
  # 以前这里完全没有滚动 —— 只靠 943 行"跑完任务清一次", 不跑的天只进不出,
  # 实测 logs 撑到 159MB。现在两层防护:
  #   ① 大小滚动: 单文件超过 log_max_bytes 就切成 .1/.2/... 留 log_backup_count 份
  #      → 单个端口封顶 ≈ max_bytes × (1 + backup_count) = 2MB × 4 = 8MB。
  #   ② 按天归档+过期删除: 见 rotate_text_logs(), 触发点是 启动/跨日/任务结束。
  log_max_bytes: 2097152        # 2 MB
  log_backup_count: 3
  log_keep_days: 7              # ≥7 天的归档件删掉; 0 = 不删

  # 2026-10-18 v4.6.0 (P0-5): 定时任务健壮性。以前这四个数全都写死在代码里,
  # 最遭骂的一条是"错过即丢" —— GUI 没开就静默跳过, 用户完全不知道今天漏了。
  timer_grace_minutes: 3        # 到点后超过这么久才算"错过"(错过会明确报案)
  timer_max_retry: 2            # 任务失败最多重试几次; 用完才占掉当天份额
  timer_retry_cooldown_seconds: 300   # 重试之间的冷却(秒): 5 分钟, 防止反复鞭尸
  timer_stagger_seconds: 20     # 多条定时同时到点时错峰(秒): 别一起抢 adb

  # 脚本固定停顿(sleep)的全局上限(秒): 0 = 不限制(按脚本里写的秒数睡)。
  # 想整体压缩干等就填个数(如 10), 不用去改每个任务脚本。
  # ⚠️ 别压这几个安全窗口: 组队一条「监控-安静确认」4×60秒(跨最长约3分钟的
  #    赶路间隙, 09-11 事故换来)、地煞「等12秒」(游戏强制按钮10秒后可点)。
  #    域外/师门/五环的收尾停顿已经在脚本里压到 10~15 秒, 无需再动。
  max_sleep_seconds: 0

  # 2026-10-18 v4.5.0 (P0-3): 心跳 / 孤儿判定。
  # 多开子进程(引擎主线程)周期性发心跳, 主 GUI 据此区分"正常长跑"与"僵尸进程(假运行中)"。
  # 子进程卡死(adb 冻结/主线程死锁/被其它会话遗留)不会写 task_end, 仅靠 PID 判活会永久
  # 停在「运行中」; 心跳超时即判孤儿并强制回收。
  #   heartbeat_interval: 子进程发心跳的间隔(秒), 默认 5。健康进程每 ≤5s 一拍。
  #   heartbeat_timeout : GUI 判定孤儿的时间阈值(秒), 默认 120。必须 ≥ 子进程正常启动耗时
  #     (adb 连接/大任务加载/OCR 模型加载)且远大于心跳间隔, 否则会把慢启动误杀成孤儿。
  #     健康进程每 ≤5s 一拍, 永远远小于此值; 只有真正卡死(主线程在心跳点之外阻塞超过
  #     此值)才会触发强制回收。需要更激进地抓卡死可下调, 但别低于 ~60s。
  heartbeat_interval: 5
  heartbeat_timeout: 120

# Windows 鼠标注入通道（任务脚本里写 via: win 的步骤用它绕开反注入）
# 换电脑后若报「未找到 MuMu 窗口」，把该机 MuMu 窗口的标题关键字或 hwnd 填进来即可。
# 取这些值：GUI「脚本选项」页 → 左侧选「运行(全局)」→ 点「窗口诊断…」→
#          复制清单里标着「MuMu候选」的那行。（2026-10-15 从主窗口左侧搬到该页）
win_input:
  enabled: true          # false = 所有 via:win 步骤都改用 adb 点击
  hwnd: 0                # 指定窗口句柄(0=自动查找; 多开时最稳的写法)
  index: 0               # 自动查找命中多个窗口时用第几个(按窗口从左到右)
  title_contains: []     # 追加标题关键字，如 ["MuMu模拟器12"]
  exe_contains: []       # 追加进程名关键字，如 ["MuMuPlayer.exe"]
  fallback_adb: true     # 找不到窗口时自动降级为 adb 点击(不中断任务)
  # 坐标校准值(默认 540x960 下的实测值; 分辨率或缩放变了用 scripts/calib_win.py 重校)
  scale_x: 0.6772
  scale_y: 0.6754
  y_offset: 40.5

# 地煞星挑战选项（GUI「脚本选项」页可改，这里改完同样生效，需重启 GUI/下轮任务）
dixia:
  # 挑战哪一档星级:
  #   auto = 旧默认逻辑(有10星点10星, 没有=点列表第1行)
  #   row1~row4 = 星级列表可视区从上数第1~4行的「前往」(行内容随角色不同:
  #     62级小号实测=1~4星, 第4行=能打的最高档; 主号打开时第1行=10星)
  #   坐标按 540x960 实测(行距约83px, 前往按钮 x≈438)
  star_row: "auto"

app:
  package: "com.netease.xyfz_02"
  # 2026-10-16 v3.0.0: 删掉 log_dir(代码零读取)。日志目录由各入口用
  # setup_logger() 显式指定, 分布在不同端口子目录(logs/run_<port>.log)。
  # 重复启动时不再开第二个窗口(避免两个进程抢同一模拟器/互占日志文件)
  single_instance: true
  # 退出时回收【本包自带】的 adb server(它是"删不掉文件夹"最常见的占用者)。
  # 只回收 tools\adb\adb.exe 拉起的那个, 不会碰 MuMu 自己的 adb。
  kill_adb_on_exit: true
