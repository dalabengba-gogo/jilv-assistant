# -*- coding: utf-8 -*-
# ============================================================
# 域外风情/修罗任务(每日额外50次) —— 2026-09-10 实测更新
# ------------------------------------------------------------
# 流程: 主界面 → 玩法面板(日常页签,列表回顶) → OCR点卡片
#       → 介绍页点「前往」(350,795,介绍页右下,左边是组队按钮)
#       → 寻路(灵兽村)进战斗 → 战斗自动进行(无需点自动) → 连打额外次数
#       → 期间无任何弹窗(实测不弹奖励界面), 长等主界面即可
#
# 注意:
#   - 同一活动不同等级角色显示名不同(用户确认): 高等级=域外风情/修罗任务,
#     低等级=抓鬼任务(2026-09-11 用户确认卡名,非鬼王)。三个名字都试;
#     引擎 OCR 是子串包含匹配, 关键字不会误匹配(需完整子串出现)
#   - 分两部分: 组队一条含的10次多倍 + 每日额外50次
#     本脚本跑的是介绍页里的「今日额外次数: x/50」, 与组队一条互不影响
#   - 卡片在「日常」页签, 位置会变用 OCR 定位; 2026-09-28 起改为「逐屏滚动找卡」
#     (最多 6 屏): 实测首屏已被 挖宝封妖/烧法任务/商旅护送/帮派任务 占满,
#     域外风情被挤到下面, 只回顶一次是找不到的
#   - 介绍页底部: 组队(160,782) / 前往(350,795), 别点错左边的组队
#   - 需要 3 人组队(人数不足时可能无法开打); 建议先跑组队一条组好队
#   - 50 场约 40~90 分钟(实测双高转队伍约 40 分钟), 监控循环 60 轮×90 秒兜底
#   - 实测: 点「前往」后整段 50 次自动连续推进(寻路→战斗自动→下一场),
#     全程不弹奖励结算界面(用户实测), 结束条件=介绍页「今日额外次数 50/50」
#   - 语法: 每步只写一个动作键(click/sleep/swipe 不能同步骤混写)
# ============================================================
name: 域外风情(额外50次)
description: 玩法面板→OCR点域外风情卡→介绍页点前往→托管连打→长等主界面

settings:
  default_timeout: 10
  default_retry: 2

steps:
  - name: 确认主界面
    wait: {ui: 主界面}
    timeout: 10
    retry: 3
    # 2026-09-11: 不硬终止 —— 上段若遗留浮层, 本段随后会自己重开面板导航
    on_fail: continue

  - name: 打开玩法面板
    click: [506, 539]

  - name: 等玩法面板出现
    wait: {ui: 玩法面板}
    timeout: 5
    retry: 0
    # 2026-09-11 11:48 事故修复: 偶发点击被吞(主界面点玩法按钮无响应),
    # 旧版干等30秒后继续, 面板没开导致整段空转静默跳过。改为 goto 重开块重试2次
    on_fail: {goto: "域外-面板重开-点玩法按钮(1/2)"}

  # 2026-09-10 新增: 确保在「日常」页签(卡片在这个页签里)
  - name: 域外-点日常页签(确保在正确页签)
    click: [95, 934]
    on_fail: continue

  - name: 页签切换停顿
    sleep: 1

  # ---------- 列表回顶, 保证「域外风情」在首屏 ----------
  - name: 玩法列表下拉回顶(1/2)
    swipe: {from: [270, 320], to: [270, 860], duration: 200}

  - name: 停顿1秒
    sleep: 1

  - name: 玩法列表下拉回顶(2/2)
    swipe: {from: [270, 320], to: [270, 860], duration: 200}

  - name: 停顿1秒
    sleep: 1

  # 2026-09-10 新增: 额外次数已满(今日额外次数：50/50)则整段跳过;
  # 未做时显示 0/50, 不含子串 50/50, 面板活跃度 150/150 也不含, 不会误判
  - name: 域外-若额外次数已满50/50则跳过
    wait: {ocr: 50/50}
    timeout: 5
    retry: 0
    on_success: {goto: "域外-结束前检测是否已在主界面"}
    on_fail: continue

  # ---------- 逐屏滚动找卡(2026-09-28 重写) ----------
  # 事故: 用户反馈"域外被其他任务遮挡, 识别不到"。现场截图 + OCR 实测:
  #   日常页签首屏已变成 挖宝封妖 / 烧法任务 / 商旅护送 / 帮派任务 四张卡,
  #   「域外风情/修罗任务/抓鬼任务」被挤到列表更下面 —— 旧版只做"回顶"然后
  #   直接 OCR 点卡(注释里那句"修罗任务在第一位"早就过期了), 三步全找不到,
  #   于是整段域外静默跳过。
  # 新做法: 从顶部开始一屏一屏往下找, 每屏先查「已完成」徽标、再点三种卡名,
  #   没找到就上滑一屏继续, 最多 6 屏; 6 屏都没有才走找卡恢复块。
  # 卡名三选一铁律不变: 除最后一个外都 continue, 成败判定交给「等介绍页」。
  - name: 域外-滚动找卡循环
    loop: 6
    steps:
      # 低等级号任务做完后面板卡片显示「已完成」徽标(额外次数永远到不了 50/50
      # 的账号也会完成), 只认 50/50 会无限批次循环 → 卡片可见时查徽标就收尾
      - name: 域外-滚动-查已完成徽标(域外风情)
        wait: {ocr_pair: [已完成, 域外风情]}
        timeout: 3
        retry: 0
        on_success: {goto: "域外-结束前检测是否已在主界面"}
        on_fail: continue

      - name: 域外-滚动-查已完成徽标(修罗任务)
        wait: {ocr_pair: [已完成, 修罗任务]}
        timeout: 3
        retry: 0
        on_success: {goto: "域外-结束前检测是否已在主界面"}
        on_fail: continue

      - name: 域外-滚动-查已完成徽标(抓鬼任务)
        wait: {ocr_pair: [已完成, 抓鬼任务]}
        timeout: 3
        retry: 0
        on_success: {goto: "域外-结束前检测是否已在主界面"}
        on_fail: continue

      - name: 域外-滚动-点域外风情卡片
        click: {ocr: 域外风情}
        timeout: 6
        retry: 0
        on_fail: continue

      - name: 域外-滚动-点修罗任务卡片
        click: {ocr: 修罗任务}
        timeout: 6
        retry: 0
        on_fail: continue

      - name: 域外-滚动-点抓鬼任务卡片
        click: {ocr: 抓鬼任务}
        timeout: 6
        retry: 0
        on_fail: continue

      # 三选一的成败统一在这里判定: 介绍页开了就跳回主流程
      - name: 域外-滚动-等介绍页
        wait: {ocr: 任务说明}
        timeout: 5
        retry: 0
        on_success: {goto: "域外-若弹离线完成提示则点继续进行"}
        on_fail: continue

      - name: 域外-滚动-上滑一屏继续找
        swipe: {from: [270, 700], to: [270, 260], duration: 250}

      - name: 域外-滚动-停顿
        sleep: 1

  # 顺序流走到这里 = 6 屏都没找到卡片 → 交给找卡恢复块(拉回顶部, 只在顶部再试一次;
  # 那一块是固定次数、失败即关面板收尾, 所以不会和本循环形成死循环)
  - name: 域外-滚动找卡-六屏都没找到
    jump: 域外-找卡恢复-拉回顶部(1/2)

  # 2026-09-10 新增: 该玩法离线期间已完成时, 点入口会弹
  # 「当前玩法已在离线期间完成,是否前往领取奖励?」挡住后续流程
  # → OCR 到「继续进行」就点它(奖励由领奖脚本的玩法面板宝箱统一领)
  - name: 域外-若弹离线完成提示则点继续进行
    wait: {ocr: 继续进行}
    timeout: 6
    retry: 0
    click_center: true
    on_fail: continue
  - name: 等介绍页(任务说明)
    wait: {ocr: 任务说明}
    timeout: 8
    retry: 2
    on_fail: {goto: "域外-找卡恢复-关面板收尾"}

  # 2026-09-16 事故修复(00:10/07:19 两轮同款): 50/50 只显示在介绍页上,
  # 玩法面板卡片上 OCR 认不出 → 面板上查 50/50 永远失败 → 已做完也再点
  # 卡片/前往死循环。介绍页开着时在这里查: 已满直接收尾, 不再点前往
  - name: 域外-介绍页查额外次数已满50
    wait: {ocr: 50/50}
    timeout: 5
    retry: 0
    on_success: {goto: "域外-结束前检测是否已在主界面"}
    on_fail: continue

  - name: 点前往(介绍页右下按钮)
    click: [350, 795]

  # ---------- 开打 ----------
  - name: 等战斗出现(寻路后,最长2分钟)
    # 2026-09-14: 多信号(回合/自动中/逃跑), 组队/横幅遮挡时「回合」可能不可见
    wait: {any: [{ocr: 回合}, {ocr: 自动中}, {ocr: 逃跑}]}
    timeout: 120
    on_fail: continue

  # 2026-09-16 加固: 点前往没生效(已完成50/50/点击被吞)时介绍页还开着 ——
  # 旧版直接流入「等打完回主界面(90分钟)」死等, 介绍页挡着永远等不到。
  # 介绍页还在=没开打, 直接收尾
  - name: 域外-前往无效则收尾
    wait: {ocr: 任务说明}
    timeout: 4
    retry: 0
    on_success: {goto: "域外-结束前检测是否已在主界面"}
    on_fail: continue

  # 2026-09-23 傍晚修复: 点前往后介绍页关了但**玩法面板还开着**(游戏行为,
  # 低等级号实测)——面板盖住画面, 下方 90 分钟等待永远看不到主界面,
  # 实测白等 3 小时(任务其实早做完了)。等待前先把面板关掉
  - name: 域外-长等前若面板开着则关闭
    wait: {ui: 玩法面板}
    timeout: 3
    retry: 0
    click: [27, 930]
    on_fail: continue

  - name: 域外-长等前停顿
    sleep: 2

  # 2026-09-11 修改(用户实测): 域外/修罗全程不弹奖励结算界面,
  # 删掉原来的「清理结算弹窗」循环, 改为长等待 + 复核:
  # 50 场约 40~90 分钟, 打完自动回主界面。
  # 2026-09-11 11:59 事故修复: 单次 wait 主界面 会在两场战斗之间/寻路瞬间
  # 误判"打完了"→脚本提前退出(失去监控, 若被弹窗堵死没人处理)。
  # 改为「主界面 + 无『回合』」双条件复核, 不安静就跳回长等(每轮约2.5分钟)。
  - name: 域外-等打完回主界面(最长90分钟)
    wait: {ui: 主界面}
    timeout: 5400
    retry: 1
    on_fail: continue

  # 2026-09-23 事故自愈: 批次重开块会在战斗中盲点(506,539), 若战斗恰好
  # 结束, 该点击会把玩法面板打开 —— 面板盖住画面后「主界面」模板时好时坏,
  # 下方 652↔654 循环无出口, 实测空转 8 小时。每轮复核前先关掉可能
  # 开着的面板(面板标题在屏上才点关闭, 防误触)
  - name: 域外-复核前若面板开着则关闭
    wait: {ui: 玩法面板}
    timeout: 3
    retry: 0
    click: [27, 930]
    on_fail: continue

  # 2026-09-29 压缩(用户诉求: 长等待砍到 5-10s): 原 150 秒纯盲等。
  # 这一步真正起作用的不是"睡 150 秒", 而是下面两步复核(主界面 + 无战斗
  # OCR)和主界面模板的 not_screens:[战斗中](09-23 加的第一层修正)。
  # 空睡 150 秒唯一效果是让每轮批次多花 140 秒 → 改 10 秒。
  # 复核不通过依旧跳回 90 分钟长等, 安全性不变(长等本身是条件等待, 一到就返回)。
  - name: 域外-复核停顿10秒(等战斗间隙过去)
    sleep: 10

  - name: 域外-复核是否仍在主界面
    wait: {ui: 主界面}
    timeout: 15
    retry: 1
    on_fail: {goto: "域外-等打完回主界面(最长90分钟)"}

  - name: 域外-复核是否无战斗
    wait: {not: {any: [{ocr: 回合}, {ocr: 自动中}, {ocr: 逃跑}]}}
    timeout: 3
    retry: 0
    on_fail: {goto: "域外-等打完回主界面(最长90分钟)"}

  # ---------- 批次循环(2026-09-11 13:10 实测发现) ----------
  # 额外50场不是一次「前往」跑完: 每批约10场, 批结束回主界面就停,
  # 必须重开面板查进度、未满50/50就再点卡→前往。循环终止条件=面板显示50/50。
  - name: 域外-批次结束后重开面板
    click: [506, 539]

  - name: 域外-批次后等面板出现
    wait: {ui: 玩法面板}
    timeout: 8
    retry: 2
    # 2026-09-11 16:23 事故修复: 面板开不出来(偶发吞点击)时旧版 continue 空转,
    # 下一步在任务栏误点"域外风情"→失败→静默收尾(域外没跑完却报"成功")。
    # 改为 goto 批次重开块重试开面板
    on_fail: {goto: "域外-批次重开-点按钮(1/2)"}

  # 2026-09-11 16:23: 查次数前先确认面板真的开着(防面板没开时 OCR 在任务栏误匹配)
  - name: 域外-批次后确认面板已开
    wait: {ui: 玩法面板}
    timeout: 3
    retry: 0
    on_fail: {goto: "域外-批次重开-点按钮(1/2)"}

  # 2026-09-23 傍晚: 面板开着时先查「已完成」徽标 —— 任务做完(多倍次数用完)
  # 额外次数可能停在 x/50 不到 50/50, 只认 50/50 会无限批次循环
  - name: 域外-批次后查已完成徽标(域外风情)
    wait: {ocr_pair: [已完成, 域外风情]}
    timeout: 4
    retry: 0
    on_success: {goto: "域外-结束前检测是否已在主界面"}
    on_fail: continue

  - name: 域外-批次后查已完成徽标(修罗任务)
    wait: {ocr_pair: [已完成, 修罗任务]}
    timeout: 4
    retry: 0
    on_success: {goto: "域外-结束前检测是否已在主界面"}
    on_fail: continue

  - name: 域外-批次后查已完成徽标(抓鬼任务)
    wait: {ocr_pair: [已完成, 抓鬼任务]}
    timeout: 4
    retry: 0
    on_success: {goto: "域外-结束前检测是否已在主界面"}
    on_fail: continue

  - name: 域外-查额外次数已满50
    wait: {ocr: 50/50}
    timeout: 5
    retry: 0
    on_success: {goto: "域外-结束前检测是否已在主界面"}
    on_fail: continue

  - name: 域外-未满50再点域外卡片
    click: {ocr: 域外风情}
    timeout: 8
    retry: 1
    on_fail: continue

  - name: 域外-未满50再点修罗卡片
    click: {ocr: 修罗任务}
    timeout: 8
    retry: 1
    # 2026-09-11: 加抓鬼后改为 continue, 收尾判定交给抓鬼兜底(低等级号只有抓鬼卡)
    on_fail: continue

  - name: 域外-未满50再点抓鬼卡片
    click: {ocr: 抓鬼任务}
    timeout: 8
    retry: 1
    # 2026-09-14 事故修复: 改 continue —— 修罗/域外点中后抓鬼必然找不到,
    # 旧版 goto 收尾把"已成功打开介绍页"误判为链失败, 提前结束批次循环
    # (当天修罗 6/50 就收尾的根因)。成功与否统一交给下方「再等介绍页」判定
    on_fail: continue

  - name: 域外-未满50再等介绍页
    wait: {ocr: 任务说明}
    timeout: 8
    retry: 2
    on_fail: {goto: "域外-结束前检测是否已在主界面"}

  # 2026-09-16 同款修复: 批次循环真正的 50/50 判定位置在介绍页(面板上认不出)
  - name: 域外-批次-介绍页查额外次数已满50
    wait: {ocr: 50/50}
    timeout: 5
    retry: 0
    on_success: {goto: "域外-结束前检测是否已在主界面"}
    on_fail: continue

  - name: 域外-未满50再点前往
    click: [350, 795]

  - name: 域外-批次后等战斗出现
    wait: {any: [{ocr: 回合}, {ocr: 自动中}, {ocr: 逃跑}]}
    timeout: 120
    on_fail: continue

  # 2026-09-16 同款加固: 前往没生效(介绍页还开着)直接收尾, 防死等90分钟
  - name: 域外-批次后-前往无效则收尾
    wait: {ocr: 任务说明}
    timeout: 4
    retry: 0
    on_success: {goto: "域外-结束前检测是否已在主界面"}
    on_fail: continue

  # 2026-09-23 傍晚同款修复(批次链): 点前往后面板还开着, 必须先关再等
  - name: 域外-批次后-长等前若面板开着则关闭
    wait: {ui: 玩法面板}
    timeout: 3
    retry: 0
    click: [27, 930]
    on_fail: continue

  - name: 域外-批次后-长等前停顿
    sleep: 2

  - name: 域外-批次后等打完回主界面
    wait: {ui: 主界面}
    timeout: 5400
    retry: 1
    on_fail: continue

  # 2026-09-23 同款面板自愈(见主流程注释): 批次重开块盲点可能开面板,
  # 不关掉则下面 652↔654 死循环无出口(实测空转 8 小时)
  - name: 域外-批次后-若面板开着则关闭
    wait: {ui: 玩法面板}
    timeout: 3
    retry: 0
    click: [27, 930]
    on_fail: continue

  - name: 域外-批次后复核停顿10秒
    # 2026-09-29 压缩: 同主流程(150 → 10 秒), 安全性由下面的「复核仍主界面 +
    # 复核无战斗」两步把关, 失败仍跳回 90 分钟长等
    sleep: 10

  - name: 域外-批次后复核仍主界面
    wait: {ui: 主界面}
    timeout: 15
    retry: 1
    on_fail: {goto: "域外-批次后等打完回主界面"}

  - name: 域外-批次后复核无战斗
    wait: {not: {any: [{ocr: 回合}, {ocr: 自动中}, {ocr: 逃跑}]}}
    timeout: 3
    retry: 0
    on_fail: {goto: "域外-批次后等打完回主界面"}

  - name: 域外-批次后跳回查次数
    jump: 域外-批次结束后重开面板

  # ---------- 批次重开块(仅 on_fail goto 进入, 顺序流不会走到) ----------
  # 2026-09-11 16:23 新增: 批次结束后重开面板偶发被吞点击, 重试 2 次;
  # 仍开不出来则回"批次后等打完回主界面"重新等(绝不静默收尾)
  - name: 域外-批次重开-点按钮(1/2)
    click: [506, 539]

  - name: 域外-批次重开-等出现(1/2)
    wait: {ui: 玩法面板}
    timeout: 6
    retry: 0
    on_success: {goto: "域外-查额外次数已满50"}
    on_fail: continue

  - name: 域外-批次重开-点按钮(2/2)
    click: [506, 539]

  - name: 域外-批次重开-等出现(2/2)
    wait: {ui: 玩法面板}
    timeout: 6
    retry: 0
    on_success: {goto: "域外-查额外次数已满50"}
    on_fail: {goto: "域外-批次后等打完回主界面"}

  # ---------- 收尾(面板开着时先关掉) ----------
  - name: 域外-结束前检测是否已在主界面
    wait: {ui: 主界面}
    timeout: 3
    retry: 0
    on_success: {goto: "域外-结束,等回主界面挂机"}
    # loop 展开后循环名不是步骤名, 跳循环首轮子步骤(名字带 (1/6) 后缀)
    on_fail: {goto: "域外-结束-若在主界面则通过(1/6)"}

  # 2026-09-14: 改逃逸循环 —— 旧版只点一次关面板, 介绍页开着时点(22,916)
  # 只是"介绍页→玩法面板", 面板仍开着, 后面等主界面 3×15s 必然失败,
  # 残留面板一直挂到手动处理。改为主界面判定驱动的循环, 最多 6 轮
  - name: 域外-结束逃逸循环
    loop: 6
    steps:
      - name: 域外-结束-若在主界面则通过
        wait: {ui: 主界面}
        timeout: 3
        retry: 0
        on_success: {goto: "域外-结束已回主界面"}
        on_fail: continue

      - name: 域外-结束-点左下角返回
        click: [25, 922]
        on_fail: continue

      - name: 域外-结束-停顿
        sleep: 1

  - name: 域外-结束已回主界面
    sleep: 1

  - name: 域外-结束逃逸-跳挂机等待
    jump: 域外-结束,等回主界面挂机

  - name: 域外-结束,等回主界面挂机
    wait: {ui: 主界面}
    timeout: 180
    on_fail: continue

  # 跳板: 主流程走到这里必须跳过下方恢复块, 否则会误点卡片重开域外
  - name: 域外-主流程结束跳板
    jump: 域外-脚本结束

  # ---------- 面板重开块(仅 on_fail goto 进入, 顺序流不会走到) ----------
  # 2026-09-11 11:48 事故新增: 主界面点玩法按钮偶发被吞, 旧版干等后整段空转。
  # 重试点击2次, 仍开不出来只能放弃本段(跳脚本结束, 不误点卡片)
  - name: 域外-面板重开-点玩法按钮(1/2)
    click: [506, 539]

  - name: 域外-面板重开-等出现(1/2)
    wait: {ui: 玩法面板}
    timeout: 5
    retry: 0
    on_success: {goto: "域外-点日常页签(确保在正确页签)"}
    on_fail: continue

  - name: 域外-面板重开-点玩法按钮(2/2)
    click: [506, 539]

  - name: 域外-面板重开-等出现(2/2)
    wait: {ui: 玩法面板}
    timeout: 5
    retry: 0
    on_success: {goto: "域外-点日常页签(确保在正确页签)"}
    on_fail: {goto: "域外-脚本结束"}

  # ---------- 找卡/介绍页恢复块(仅 on_fail goto 进入, 顺序流不会走到) ----------
  # 2026-09-11 新增: 找不到卡片或介绍页时不许裸奔终止全家桶(与师门/五环同款)
  # 2026-09-11 11:48 事故加固: 恢复块必须先确保玩法面板真的开着 ——
  # 面板没开时在这里拉回顶部/找卡全是空转(本次域外整段静默跳过的根因)
  - name: 域外-恢复-若面板已开则直接找卡
    wait: {ui: 玩法面板}
    timeout: 3
    retry: 0
    on_success: {goto: "域外-找卡恢复-拉回顶部(1/2)"}
    on_fail: continue

  - name: 域外-恢复-点玩法按钮(1/2)
    click: [506, 539]

  - name: 域外-恢复-等面板出现(1/2)
    wait: {ui: 玩法面板}
    timeout: 5
    retry: 0
    on_success: {goto: "域外-找卡恢复-拉回顶部(1/2)"}
    on_fail: continue

  - name: 域外-恢复-点玩法按钮(2/2)
    click: [506, 539]

  - name: 域外-恢复-等面板出现(2/2)
    wait: {ui: 玩法面板}
    timeout: 5
    retry: 0
    on_success: {goto: "域外-找卡恢复-拉回顶部(1/2)"}
    on_fail: {goto: "域外-找卡恢复-关面板收尾"}

  - name: 域外-找卡恢复-拉回顶部(1/2)
    swipe: {from: [270, 320], to: [270, 860], duration: 200}

  - name: 域外-找卡恢复-停顿1
    sleep: 1

  - name: 域外-找卡恢复-拉回顶部(2/2)
    swipe: {from: [270, 320], to: [270, 860], duration: 200}

  - name: 域外-找卡恢复-停顿2
    sleep: 1

  - name: 域外-找卡恢复-再点域外卡片
    click: {ocr: 域外风情}
    timeout: 8
    retry: 1
    on_fail: continue

  - name: 域外-找卡恢复-再点修罗卡片
    click: {ocr: 修罗任务}
    timeout: 8
    retry: 1
    # 2026-09-11: 加抓鬼后改为 continue, 收尾判定交给抓鬼兜底
    on_fail: continue

  - name: 域外-找卡恢复-再点抓鬼卡片
    click: {ocr: 抓鬼任务}
    timeout: 8
    retry: 1
    # 2026-09-14 同款修复: 改 continue, 判定权交给下方「等介绍页确认」
    on_fail: continue

  - name: 域外-找卡恢复-等介绍页确认
    wait: {ocr: 任务说明}
    timeout: 8
    retry: 1
    on_fail: {goto: "域外-找卡恢复-关面板收尾"}

  - name: 域外-找卡恢复-成功跳回流程
    jump: 域外-若弹离线完成提示则点继续进行

  # 2026-09-11 加固: 关面板前先检测 —— 已在主界面时点左下角会误入练功区!
  - name: 域外-找卡恢复-关面板收尾
    wait: {ui: 主界面}
    timeout: 3
    retry: 0
    on_success: {goto: "域外-脚本结束"}
    on_fail: continue

  - name: 域外-找卡恢复-关面板点击
    click: [22, 916]
    on_fail: continue

  - name: 域外-找卡恢复-关面板停顿
    sleep: 1

  - name: 域外-找卡恢复-关面板后等主界面
    wait: {ui: 主界面}
    timeout: 15
    retry: 2
    on_fail: continue

  - name: 域外-脚本结束
    sleep: 1
