# -*- coding: utf-8 -*-
# ============================================================
# 组队一条(日常组队5连) 自动完成 —— 2026-09-10 修正版
# ------------------------------------------------------------
# 流程: 主界面 → 固定队 → [已有队伍(离队按钮)直接跳过创建]
#       → 无队则创建队伍 → 弹窗"一键邀请固定队成员"
#       → 关面板回主界面 → 点任务栏「组队一条」自动开跑
#       → 自动寻路+托管战斗连续推进(域外风情10/挖宝封妖10/烧法10/商旅1/帮派5)
#       → 期间循环点掉「奖励总览」结算弹窗(不会自动消失)
#
# 2026-09-10 修复(凌晨卡死1.5小时事故):
#   - 关面板坐标 22,916 → 27,930 (老坐标偏上14px点不中返回箭头)
#   - 增加"已在队伍中"分支: 面板有「离队」按钮即视为有队,不再重复创建
#   - 监控循环 retry:0 (原每轮重试3次,无战斗时空转最长75分钟)
#
# 2026-09-28 修复(一条跑一半被误判"今日已完成" → 跳过地煞/五环):
#   - 任务栏没有「组队一条」这一行 ≠ 今日已完成! 一条龙跑到一半时任务栏只显示
#     5 个子任务行(域外风情/挖宝封妖/烧法任务/商旅护送/帮派任务), 旧版据此
#     直接收尾。现改为: 还有未完成条目 → 点它续跑(见「一条-任务栏仍有条目则续跑」)。
#   - 监控循环内新增同款自愈: 停住时会点未完成条目把链条顶起来。
#
# 注意事项:
#   - 结算弹窗必须点屏幕下部深色区(450,700)关闭, 否则卡住后续任务
#   - 一条龙全新进度约 40~90 分钟, 监控循环 45 轮(约50分钟)+收尾长等兜底
#   - 语法: 每步只写一个动作键(click/sleep 不能同步骤混写)
# ============================================================
name: 组队一条(固定队一条龙)
description: 组固定队→开组队一条→自动打域外/挖宝/烧法/商旅/帮派并清理结算弹窗

settings:
  default_timeout: 10
  default_retry: 2

steps:
  - name: 确认在主界面
    wait: {ui: 主界面}
    timeout: 10
    retry: 3

  - name: 打开固定队面板
    click: [506, 683]

  - name: 等固定队面板加载
    wait: {ocr: 创建队伍}
    timeout: 8
    retry: 2
    on_fail: {goto: 已有队伍关面板}

  # 2026-09-11 凌晨事故修复: 上面等待成功(=无队伍)后会**顺序下滑**进"已有队伍"分支,
  # 导致「点创建队伍」永远执行不到(没建队就直奔任务栏,一条龙开不了)。
  # 正常路径必须 jump 跳过已有队伍分支!
  - name: 无队伍-跳到创建队伍
    jump: 点创建队伍

  # 2026-09-10 下午修复死循环: 角色已在固定队(如5/5满员)时面板只有
  # 「邀请入队/加入队伍」,没有「创建队伍」→ 走本分支:
  #   关面板 → 回主界面 → 直接跳去点任务栏开跑
  # 旧版 goto 到「已有队伍直接开跑」只 wait 主界面(面板还开着必然失败),
  # 再点返回箭头后顺序下滑又回到「打开固定队面板」,45→54→41 死循环 25 分钟
  # 2026-09-15 加固: 盲点(27,930)有风险 —— 面板没真开时该坐标落在主界面左下角
  # (聊天气泡/练功区入口)。面板特征在屏上才点关闭, 否则跳过
  - name: 已有队伍关面板
    wait: {any: [{ocr: 邀请入队}, {ocr: 加入队伍}, {ocr: 创建队伍}]}
    timeout: 3
    retry: 0
    click: [27, 930]
    on_fail: continue

  - name: 已有队伍停顿2秒
    sleep: 1

  - name: 已有队伍确认回主界面
    wait: {ui: 主界面}
    timeout: 15
    retry: 2
    on_fail: {goto: 组队-再点返回箭头}

  - name: 已有队伍跳到开跑
    jump: 点任务栏-组队一条开跑

  # 注意: 固定队页签的「离队」是退出固定队的常驻按钮,
  #       不能作为“已在队伍”的判据(2026-09-10 踩坑已移除)
  - name: 点创建队伍
    click: [168, 823]

  - name: 停顿2秒
    sleep: 1

  - name: 等邀请弹窗(没有则跳过邀请直接关面板)
    wait: {ocr: 一键邀请}
    timeout: 8
    on_fail: {goto: 关闭固定队面板回主界面}

  - name: 点邀请入队
    click: [370, 632]

  - name: 停顿3秒
    sleep: 2

  # 2026-09-11 低等级号实测加固: 邀请后面板可能已自动关闭 —— 不确认就点
  # (27,930) 会落在主界面左下角误入练功区。面板开着才点关闭, 已关则直接跳过
  - name: 关闭固定队面板回主界面
    wait: {any: [{ocr: 邀请入队}, {ocr: 加入队伍}]}
    timeout: 4
    retry: 0
    click: [27, 930]
    on_fail: continue

  - name: 停顿2秒
    sleep: 1

  - name: 创建后确认回主界面
    wait: {ui: 主界面}
    timeout: 10
    retry: 1
    on_fail: {goto: 组队-再点返回箭头}

  # 成功路径必须 jump 走,否则会滑到“再点返回箭头”在主界面乱点
  - name: 在主界面:跳到开跑
    jump: 点任务栏-组队一条开跑

  - name: 组队-再点返回箭头
    click: [27, 930]

  - name: 停顿2秒
    sleep: 1

  - name: 组队-最终确认主界面
    wait: {ui: 主界面}
    timeout: 15
    retry: 2
    on_fail: continue

  # 2026-09-10 修复: 任务栏条目位置会随主线换行而变动,固定坐标 420,289
  # 曾误点到下面的"修罗任务";改 OCR 定位(多命中时取最上方=任务栏)
  # 2026-09-10 傍晚修复: 今天一条龙已做完时任务栏没有「组队一条」条目,
  # 本步 3 次重试全失败后直接终止整个全家桶 → 师门/五环/域外全被跳过。
  # 改为: 2 次尝试, 找不到就视为"今日已完成", 跳到本段收尾继续下一段
  # 2026-09-29 凌晨事故修复: 右侧面板可能停在「队伍」页签(显示队友列表),
  # 任务列表整个不可见 → OCR 找不到「组队一条」, 续跑判据也扫不到任何行,
  # 两级判据全失败被误判"今日已完成"整段跳过(00:12 趟次实测)。
  # 现改为: 找不到条目 → 先点「任务」页签(区域限定, 防误点同屏其他"任务"字样)
  # → 再重试一次; 仍失败才走续跑/已完成判据
  - name: 点任务栏-组队一条开跑
    click: {ocr: 组队一条}
    timeout: 10
    retry: 1
    on_success: {goto: 停顿5秒}
    on_fail: {goto: 一条-切到任务页签}

  # 页签位置实测(540x960): 「任务」tab 文字框约 (395,163)-(428,182),
  # region 取其外扩一圈; 「队伍」tab 在 x≈480 不在范围内
  - name: 一条-切到任务页签
    click: {ocr: 任务, region: [375, 150, 450, 195]}
    timeout: 5
    retry: 0
    on_fail: {goto: 一条-任务栏仍有条目则续跑}

  - name: 一条-切页签后停顿
    sleep: 1

  # 2026-09-29 事故修复(10:26 趟次实录): 任务栏本来就在「任务」页签上时,
  # 再点「任务」标题会被游戏解释为"打开任务总览"——全屏面板盖住主界面,
  # 后续找条目/续跑判据/结束等待全部失效(日志卡在"结束,等回主界面挂机")。
  # OCR 到「任务总览」标题就点左下角返回箭头关掉, 不存在则跳过
  - name: 一条-若误开任务总览则关闭
    wait: {ocr: 任务总览}
    timeout: 3
    retry: 0
    click: [25, 922]
    on_fail: continue

  - name: 一条-关总览后停顿
    sleep: 1

  - name: 一条-任务页签下再点组队一条
    click: {ocr: 组队一条}
    timeout: 10
    retry: 1
    on_success: {goto: 停顿5秒}
    on_fail: {goto: 一条-任务栏仍有条目则续跑}

  - name: 停顿5秒
    sleep: 2

  # 2026-09-15 事故修复(卡聊天界面4.5小时): 上一步 OCR「组队一条」命中了
  # 左下角**世界聊天气泡**(玩家在世界频道喊"组队一条"组人), 点气泡=打开
  # 聊天界面而非开跑, 一条龙根本没开始。点完必须确认没有误开聊天
  - name: 组队-确认没误开聊天界面
    wait: {ocr: 说点什么}
    timeout: 4
    retry: 0
    on_success: {goto: 组队-误开聊天恢复-点返回}
    on_fail: continue

  # 2026-09-10 新增: 该玩法离线期间已完成时, 点任务栏会弹
  # 「当前玩法已在离线期间完成,是否前往领取奖励?」挡住一条龙
  # → OCR 到「继续进行」就点它(奖励由领奖脚本的玩法面板宝箱统一领)
  - name: 若弹离线完成提示则点继续进行
    wait: {ocr: 继续进行}
    timeout: 6
    retry: 0
    click_center: true
    on_fail: continue

  # ---------- 监控循环: 点掉结算弹窗 + 探测链条是否结束 ----------
  # 2026-09-11 上午重构(误判事故): 旧探测用 OCR"达成条件后继续主线",
  #   但该文案在**子任务切换间隙**(修罗10/10完成→挖宝封妖开始之间)也会短暂出现,
  #   08:50 监控第11轮误命中 → 提前收尾,商旅护送/帮派任务没做就跑去下一段了。
  # 新判定(两要素缺一不可):
  #   ① 主界面模板命中(排除战斗/弹窗/寻路画面);
  #   ② 任务栏无任何一条龙相关条目(组队一条/修罗任务/域外风情/挖宝封妖/烧法任务/商旅护送/帮派任务)。
  #   实测链条进行中,主界面下「组队一条」条目始终显示(子任务切换间隙也在)。
  # 命中后还要过 45 秒二次确认(防止切换间隙的假象), 不过则回到监控第1轮继续。
  - name: 清理结算弹窗
    loop: 45
    steps:
      - name: 监控-若出现奖励结算则点掉
        wait: {any: [{ocr: 奖励总览}, {ocr: 获得奖励}]}
        timeout: 60
        retry: 0
        click: [450, 700]
        on_fail: continue

      - name: 监控-确认在主界面
        wait: {ui: 主界面}
        timeout: 5
        retry: 0
        on_fail: continue

      # 2026-09-15 新增自愈: 不在主界面时若聊天界面开着(误点气泡/弹窗点击
      # 落在聊天入口), 点左下角返回箭头关掉, 下一轮恢复正常判定
      - name: 监控-若误开聊天界面则关闭
        wait: {ocr: 说点什么}
        timeout: 3
        retry: 0
        click: [25, 922]
        on_fail: continue

      - name: 监控-任务栏无任何一条龙条目
        wait: {not: {any: [{ocr: 组队一条}, {ocr: 修罗任务}, {ocr: 域外风情}, {ocr: 挖宝封妖}, {ocr: 烧法任务}, {ocr: 商旅护送}, {ocr: 帮派任务}]}}
        timeout: 10
        retry: 1
        on_success: {goto: "监控-安静确认-第1轮停顿"}
        on_fail: continue

      # 2026-09-28 新增自愈(走到这里 = 任务栏还有一条龙条目 = 没做完):
      # 此时画面已静止在主界面(不在战斗、没开面板), 说明链条停住了 ——
      # 一条龙被打断后不会自己续上, 必须点一下任务栏里的未完成条目才会继续寻路。
      # 判据按用户口径「任务栏还有条目就是没做完, 可以继续做」, 但只点**未完成**行:
      #   行内带计数(含 "/") 且不含完成勾(V/√/✓)。用区域限定只看任务栏,
      #   绝不枚举具体任务名, 也点不到左下角世界聊天气泡(2026-09-15 事故)。
      - name: 监控-还有未完成条目则点它续跑
        wait: {any: [{ocr_row: {has: ["/"], not: [V], region: [356, 150, 540, 320]}}, {ocr_row: {has: ["/"], not: ["√"], region: [356, 150, 540, 320]}}, {ocr_row: {has: ["/"], not: ["✓"], region: [356, 150, 540, 320]}}]}
        timeout: 6
        retry: 0
        click_center: true
        on_fail: continue

      - name: 监控-续跑后停顿让寻路起步
        sleep: 3

  # 跳板(不可放主路径, jump 是无条件跳转): 已做完 → 收尾,全家桶继续跑下一段
  - name: 一条今日已完成-跳过收尾
    jump: 结束,等回主界面挂机

  # ---------- 一条龙"跑到一半"续跑块(仅 on_fail goto 进入, 顺序流不会走到) ----------
  # 2026-09-28 事故修复 —— 用户反馈: 日常一条只做了一部分, 脚本就识别不了,
  # 直接跳过一条跑去地煞、五环了。
  # 现场(实测日志 + 截图): 一条龙里「域外风情10/10」做完了, 但「挖宝封妖0/10」
  # 「烧法任务0/10」「商旅护送0/1」「帮派任务0/5」都还没做。这种"半途"状态下
  # 任务栏里**根本没有「组队一条」这一行**, 只有这 5 个子任务行 —— 而旧版
  # 「点任务栏-组队一条开跑」找不到「组队一条」就直接判定"今日已完成",
  # 于是整条没跑完就跳走了(地煞/五环自然也跟着错位)。
  # 修法(按用户口径): 任务栏里只要还有**未完成**的条目, 就证明一条没做完,
  # 点它继续做; 一个条目都没有才是真做完。
  # 判据不枚举任务名: 行内含计数(有 "/")、且不含完成勾(V/√/✓), 并且只认
  # 任务栏区域(x≥356) —— 避免命中左下角世界聊天气泡(2026-09-15 打开聊天事故)。
  - name: 一条-任务栏仍有条目则续跑
    wait: {any: [{ocr_row: {has: ["/"], not: [V], region: [356, 150, 540, 320]}}, {ocr_row: {has: ["/"], not: ["√"], region: [356, 150, 540, 320]}}, {ocr_row: {has: ["/"], not: ["✓"], region: [356, 150, 540, 320]}}]}
    timeout: 8
    retry: 1
    click_center: true
    on_fail: {goto: 一条今日已完成-跳过收尾}

  - name: 一条-续跑后停顿让寻路起步
    sleep: 3

  - name: 一条-续跑后回监控循环
    jump: 监控-若出现奖励结算则点掉(1/45)

  # ----- 连续安静确认(排除子任务切换间隙与商旅护送赶路期的假象) -----
  # 2026-09-11 上午 10:33 事故: 烧法结束→商旅护送开打之间有约3分钟
  # "主界面+任务栏无条目"的赶路假象, 旧版45秒二次确认刚好被它骗过 →
  # 提前收尾跑去地煞段, 与一条龙抢画面后报错终止。
  #
  # 2026-09-11 16:55 重构(用户要求压缩结束判定耗时):
  #   旧版 = 两段150秒盲等 + 两次复核, 实测结束判定要 13.4 分钟
  #   (① 盲等期间无法察觉假象解除, 白等满150秒; ② 每次复核"7个OCR目标"
  #    引擎逐目标重跑OCR, 单次约17秒)。
  #   新版 = 4 轮轮询确认, 每轮 60 秒 + 双条件复核:
  #     ① 任意一轮复核失败 → 立即跳回监控循环首轮(假阳性约1分钟就退出);
  #     ② 4 轮全过 = 连续约 4 分钟安静 > 实测最长赶路间隙(约3分钟), 安全边界保留。
  #   配套: 引擎已加"同屏OCR缓存", 单次复核由约17秒降到约2.5秒。
  - name: 监控-安静确认-第1轮停顿
    sleep: 60

  - name: 监控-安静确认-第1轮在主界面
    wait: {ui: 主界面}
    timeout: 4
    retry: 0
    on_fail: {goto: "监控-若出现奖励结算则点掉(1/45)"}

  - name: 监控-安静确认-第1轮无条目
    wait: {not: {any: [{ocr: 组队一条}, {ocr: 修罗任务}, {ocr: 域外风情}, {ocr: 挖宝封妖}, {ocr: 烧法任务}, {ocr: 商旅护送}, {ocr: 帮派任务}]}}
    timeout: 6
    retry: 0
    on_fail: {goto: "监控-若出现奖励结算则点掉(1/45)"}

  - name: 监控-安静确认-第2轮停顿
    sleep: 60

  - name: 监控-安静确认-第2轮在主界面
    wait: {ui: 主界面}
    timeout: 4
    retry: 0
    on_fail: {goto: "监控-若出现奖励结算则点掉(1/45)"}

  - name: 监控-安静确认-第2轮无条目
    wait: {not: {any: [{ocr: 组队一条}, {ocr: 修罗任务}, {ocr: 域外风情}, {ocr: 挖宝封妖}, {ocr: 烧法任务}, {ocr: 商旅护送}, {ocr: 帮派任务}]}}
    timeout: 6
    retry: 0
    on_fail: {goto: "监控-若出现奖励结算则点掉(1/45)"}

  - name: 监控-安静确认-第3轮停顿
    sleep: 60

  - name: 监控-安静确认-第3轮在主界面
    wait: {ui: 主界面}
    timeout: 4
    retry: 0
    on_fail: {goto: "监控-若出现奖励结算则点掉(1/45)"}

  - name: 监控-安静确认-第3轮无条目
    wait: {not: {any: [{ocr: 组队一条}, {ocr: 修罗任务}, {ocr: 域外风情}, {ocr: 挖宝封妖}, {ocr: 烧法任务}, {ocr: 商旅护送}, {ocr: 帮派任务}]}}
    timeout: 6
    retry: 0
    on_fail: {goto: "监控-若出现奖励结算则点掉(1/45)"}

  - name: 监控-安静确认-第4轮停顿
    sleep: 60

  - name: 监控-安静确认-第4轮在主界面
    wait: {ui: 主界面}
    timeout: 4
    retry: 0
    on_fail: {goto: "监控-若出现奖励结算则点掉(1/45)"}

  - name: 监控-安静确认-第4轮无条目
    wait: {not: {any: [{ocr: 组队一条}, {ocr: 修罗任务}, {ocr: 域外风情}, {ocr: 挖宝封妖}, {ocr: 烧法任务}, {ocr: 商旅护送}, {ocr: 帮派任务}]}}
    timeout: 6
    retry: 0
    on_fail: {goto: "监控-若出现奖励结算则点掉(1/45)"}

  - name: 监控-确认结束跳收尾
    jump: 结束,等回主界面挂机

  # ----- 误开聊天界面恢复块(仅 goto 进入, 顺序流不会走到) -----
  # 2026-09-15 事故: OCR 点「组队一条」命中世界聊天气泡打开聊天界面,
  # 一条龙没开跑, 监控循环空转 4.5 小时。恢复: 关聊天 → 固定坐标重点任务栏
  - name: 组队-误开聊天恢复-点返回
    click: [25, 922]          # 聊天界面左下角返回箭头
    on_fail: continue

  - name: 组队-误开聊天恢复-停顿
    sleep: 2

  - name: 组队-误开聊天恢复-复核聊天已关
    wait: {not: {ocr: 说点什么}}
    timeout: 5
    retry: 1
    on_fail: continue

  - name: 组队-误开聊天恢复-重试点任务栏
    # 固定坐标(任务栏在右侧小地图下方), 避开左下角聊天气泡区
    click: [420, 289]
    on_fail: continue

  - name: 组队-误开聊天恢复-停顿2
    sleep: 2

  - name: 组队-误开聊天恢复-回监控
    jump: 监控-若出现奖励结算则点掉(1/45)

  # 2026-09-11 低等级号实测事故: 邀请入队后固定队面板可能已自动关闭,
  # 再点关闭坐标(27,930)会落在主界面左下角 → 误入练功区;
  # 旧版直接进"等回主界面挂机"(1800s×3) 在练功区空等 90 分钟。
  # 先逃逸: 不在主界面就点一下左下角(面板开=返回箭头, 练功区=退出练功区),
  # 最多 6 轮; 已在主界面则第 1 轮即通过(两个入口共用, 正常路径零开销)
  - name: 组队-收尾前回主界面(练功区逃逸)
    loop: 6
    steps:
      - name: 组队-收尾-若在主界面则通过
        wait: {ui: 主界面}
        timeout: 3
        retry: 0
        on_success: {goto: "组队-收尾已回主界面"}
        on_fail: continue

      - name: 组队-收尾-点左下角返回
        click: [25, 922]
        on_fail: continue

      - name: 组队-收尾-停顿
        sleep: 1

  - name: 组队-收尾已回主界面
    sleep: 1

  # 2026-09-11 修复: 监控循环 20 轮(~23分钟)可能短于一条龙全新进度耗时(40-60分钟),
  # 轮数耗尽后一条龙还在跑; 这里必须长等到主界面(一条龙结束必回主界面,出现即通过不浪费时间),
  # 凌晨 60s×3 等不到 → 地煞段在错误界面确认 → 整个全家桶终止
  # 2026-09-29 加固: 本步是多点汇合(含"今日已完成"跳过路径), 若入口处
  # 误开了任务总览面板, 主界面被挡会白等 90 分钟(1800s×3)。等待前先
  # 检测: 面板标题在屏上才点返回箭头, 不存在则直接长等(一条在跑时面板
  # 不在屏上, 不受影响; 且不能盲点左下角 —— 主界面时那是练功区入口)
  - name: 结束前-若任务总览面板开着则关闭
    wait: {ocr: 任务总览}
    timeout: 3
    retry: 0
    click: [25, 922]
    on_fail: continue

  - name: 结束前-关面板后停顿
    sleep: 1

  - name: 结束,等回主界面挂机
    wait: {ui: 主界面}
    timeout: 1800
    retry: 2
    on_fail: continue
