# -*- coding: utf-8 -*-
# ============================================================
# 五环任务(单人) —— 2026-09-09 实测成功
# ------------------------------------------------------------
# 流程: 主界面 → 玩法面板(列表回顶) → OCR点「五环任务」卡片
#       → 介绍页点「前往」(241,782) → 自动寻路到NPC
#       → 对话自动进行 → 战斗自动进行(无需点自动)
#       → 自动跑完 → 等「恭喜完成了今日五环任务」→ 点掉结算 → 回主界面
#
# 注意:
#   - 五环卡片位置会变(完成沉底),用 OCR 定位点击
#   - 单人任务,不需要组队; 全程无需手动干预
#   - 介绍页「前往」OCR 识别为"前注",用固定坐标 (241,782)
# ============================================================
name: 五环任务
description: 玩法面板→五环卡片(OCR定位)→前往→自动寻路对话战斗→等完成→点结算

settings:
  default_timeout: 10
  default_retry: 2

steps:
  - name: 确认主界面
    wait: {ui: 主界面}
    timeout: 10
    retry: 3
    # 2026-09-11: 不硬终止 —— 上段若遗留浮层, 本段随后会自己重开面板导航
    on_fail: continue

  # 2026-09-14 重构: 旧守卫「在队即整段跳过」太武断(队长带固定队时单人玩法可做),
  # 废弃守卫, 改在点前往后用「介绍页是否关闭」行为判别(见下方前往生效检测)。
  - name: 五环-打开玩法面板
    click: [506, 539]

  - name: 等玩法面板出现
    wait: {ui: 玩法面板}
    timeout: 10
    retry: 3
    # 2026-10-09 修复(与师门同款): 面板打不开不能再硬往下走(点页签/下拉/找卡
    # 全打在主界面上, 最后被当成"已完成"跳过)。失败即进恢复块重开面板。
    on_fail: {goto: 五环-恢复-若面板已开则直接找卡}

  # 2026-09-10 新增: 确保在「日常」页签(曾点到别的页签导致 OCR 找不到卡片)
  - name: 点日常页签(确保在正确页签)
    click: [95, 934]
    on_fail: continue

  - name: 页签切换停顿
    sleep: 1

  - name: 玩法列表下拉回顶(1/2)
    swipe: {from: [270, 320], to: [270, 860], duration: 200}

  - name: 停顿1秒
    sleep: 1

  - name: 玩法列表下拉回顶(2/2)
    swipe: {from: [270, 320], to: [270, 860], duration: 200}

  - name: 停顿1秒
    sleep: 1

  # 2026-09-11 新增: 玩法面板完成判定(同师门) —— 「已完成」徽标与卡名配对。
  # 五环卡片可能在首屏之外: 先查一次, 下滑一屏再查一次, 都没有才当作未完成
  - name: 五环-若面板显示已完成则跳过
    wait: {ocr_pair: [已完成, 五环任务], pair_min_score: 0.75}
    timeout: 5
    retry: 0
    on_success: {goto: "五环-已完成关面板"}
    on_fail: continue

  # 2026-09-11: 面板动画未就绪/OCR抖动会误判"未完成"(师门13:05事故同款), 复核一次
  - name: 五环-徽标复核停顿
    sleep: 3

  - name: 五环-徽标复核
    wait: {ocr_pair: [已完成, 五环任务], pair_min_score: 0.75}
    timeout: 5
    retry: 0
    on_success: {goto: "五环-已完成关面板"}
    on_fail: continue

  - name: 五环-列表下滑一屏找卡片
    swipe: {from: [270, 700], to: [270, 250], duration: 300}

  - name: 五环-下滑后停顿
    sleep: 1

  - name: 五环-若面板显示已完成则跳过(下滑后)
    wait: {ocr_pair: [已完成, 五环任务], pair_min_score: 0.75}
    timeout: 5
    retry: 0
    on_success: {goto: "五环-已完成关面板"}
    on_fail: continue

  # 2026-09-11 11:21 事故修复: 为查徽标下滑了一屏(卡片从 y108 被推出屏幕上方),
  # 旧版直接去 OCR 点卡 → 找不到"五环任务" → 该步无 on_fail → 全家桶终止。
  # 修复: 未完成时必须先把列表拉回顶部再点卡(五环卡固定在列表首屏顶部)
  - name: 五环-未完成回收列表(1/2)
    swipe: {from: [270, 320], to: [270, 860], duration: 200}

  - name: 五环-未完成回收停顿1
    sleep: 1

  - name: 五环-未完成回收列表(2/2)
    swipe: {from: [270, 320], to: [270, 860], duration: 200}

  - name: 五环-未完成回收停顿2
    sleep: 1

  # 主路径必须 jump 跳过下方关面板块
  - name: 五环-未完成跳过守卫块
    jump: 点五环任务卡片(OCR定位)

  - name: 五环-已完成关面板
    click: [22, 916]
    on_fail: continue

  - name: 五环-已完成停顿
    sleep: 1

  - name: 五环-已完成等回主界面
    wait: {ui: 主界面}
    timeout: 10
    retry: 2
    on_fail: continue

  - name: 五环-已完成跳收尾
    jump: 五环-等回主界面

  - name: 点五环任务卡片(OCR定位)
    click: {ocr: 五环任务}
    timeout: 8
    retry: 1
    # 2026-10-09 修复: 旧版直接 goto "拉回顶部", 绕开了"面板没开先重开"的恢复块
    on_fail: {goto: 五环-恢复-若面板已开则直接找卡}


  # 2026-09-10 新增: 该玩法离线期间已完成时, 点入口会弹
  # 「当前玩法已在离线期间完成,是否前往领取奖励?」挡住后续流程
  # → OCR 到「继续进行」就点它(奖励由领奖脚本的玩法面板宝箱统一领)
  - name: 五环-若弹离线完成提示则点继续进行
    wait: {ocr: 继续进行}
    timeout: 6
    retry: 0
    click_center: true
    on_fail: continue
  - name: 等五环介绍页
    wait: {ocr: 任务说明}
    timeout: 8
    retry: 3
    # 2026-09-14 17:25 事故(师门同款): 公告横幅吞掉点卡点击, 介绍页没开会裸奔
    # 终止全家桶。禁止裸奔。
    on_fail: {goto: 五环-介绍页未开-复核}

  - name: 点前往
    click: [241, 782]

  # 2026-09-14 新增: 队员/队长行为判别 —— 固定队**队员**点前往被游戏静默拒绝
  # (点击无任何反应), 介绍页留在原地; **队长/无队**点前往则页面立即关闭开始
  # 寻路(09-12 事故截图实锤)。以「任务说明」是否消失判别: 消失=接受继续;
  # 不消失=队员被禁, 快速收尾(不白等也不误报完成)
  - name: 五环-前往是否生效(介绍页应关闭)
    wait: {not: {ocr: 任务说明}}
    timeout: 12
    retry: 0
    on_fail: {goto: 五环-超时收尾-关面板}

  # 2026-09-12 事故修复: 角色在练功区托管挂机(绿圈)时, 玩法介绍页「前往」被游戏禁用
  # (adb/win 两通道实测都无响应), 战斗永远不会开始 —— 旧版这里 continue 后顺序流入
  # 「等恭喜完成」白筹 30 分钟。等战斗 3×120s 失败 = 任务根本没接上, 直接进收尾。
  - name: 等战斗出现(寻路+对话后)
    # 2026-09-14: 多信号(回合/自动中/逃跑), 组队/横幅遮挡时「回合」可能不可见
    wait: {any: [{ocr: 回合}, {ocr: 自动中}, {ocr: 逃跑}]}
    timeout: 120
    retry: 2
    on_fail: {goto: 五环-超时收尾-关面板}

  # 2026-09-10 傍晚修复: 「今日五环任务」过宽(中途弹窗也含), 改"恭喜完成"精确匹配
  # (真完成弹窗为「恭喜完成了今日五环任务」)
  # 2026-09-11 14:35: timeout 1200×3 太长(会白等一小时), 改 900×2=30分钟;
  # 加 on_fail 收尾 —— 异常时不许终止全家桶(与师门同款)
  - name: 等五环完成弹窗(最长15分钟)
    wait: {ocr: 恭喜完成}
    timeout: 900
    retry: 1
    on_fail: {goto: 五环-超时收尾-关面板}

  - name: 点掉五环结算(1/2)
    click: [450, 700]

  - name: 停顿2秒
    sleep: 1

  - name: 点掉五环结算(2/2)
    click: [450, 700]

  - name: 停顿2秒
    sleep: 1

  # 2026-09-11 新增: 「恭喜完成」可能是第1环弹窗, 点掉后2-5环还在后台自动跑。
  # 若立刻退出, 后续段的开面板/点击会打断链条(11:47 五环只跑1环就死的教训)。
  # 等「主界面+无回合」连续两轮(约4分钟安静)才结束本段
  - name: 五环-链条收尾-等回主界面
    wait: {ui: 主界面}
    timeout: 60
    on_fail: continue

  # 2026-09-11 15:20 用户要求: 收尾确认由约4分钟压缩到约1分钟
  # (实测「恭喜完成」即总完成弹窗, 点掉后无后台续跑; 若复核时仍在战斗则跳回继续等)
  # 2026-09-29 再压(用户诉求 5-10s): 60 → 15 秒。后面「若仍战斗则继续等」
  # 会 OCR 回合/自动中/逃跑, 真在续跑照样跳回「等回主界面」继续盯着, 不会误判
  - name: 五环-链条收尾-停顿15秒
    sleep: 15

  - name: 五环-链条收尾-若仍战斗则继续等
    wait: {not: {any: [{ocr: 回合}, {ocr: 自动中}, {ocr: 逃跑}]}}
    timeout: 3
    retry: 0
    on_fail: {goto: "五环-链条收尾-等回主界面"}

  - name: 五环-等回主界面
    wait: {ui: 主界面}
    timeout: 30
    retry: 2
    on_fail: continue

  # 跳板: 主流程走到这里必须跳过下方恢复块, 否则会误点卡片重开五环
  - name: 五环-主流程结束跳板
    jump: 五环-脚本结束

  # ---------- 介绍页未开恢复块(仅 on_fail goto 进入, 顺序流不会走到) ----------
  # 2026-09-14 17:25 事故(师门同款): 点卡片瞬间顶部弹系统公告横幅(藏宝图播报)
  # 吞掉点击, 介绍页没开 → 等五环介绍页裸奔终止全家桶。兜底: 复核→等横幅消失
  # →再点一次卡片→仍没开按超时收尾(交下一段徽标判定), 不许终止。
  - name: 五环-介绍页未开-复核
    wait: {ocr: 任务说明}
    timeout: 3
    retry: 0
    on_success: {goto: 点前往}
    on_fail: continue

  - name: 五环-介绍页未开-等横幅消失
    sleep: 6

  - name: 五环-介绍页未开-再点卡片
    click: {ocr: 五环任务}
    timeout: 8
    retry: 1
    on_fail: {goto: 五环-超时收尾-关面板}

  - name: 五环-介绍页未开-再等介绍页
    wait: {ocr: 任务说明}
    timeout: 8
    retry: 1
    on_fail: {goto: 五环-超时收尾-关面板}

  - name: 五环-介绍页未开-恢复完成
    jump: 点前往

  # ---------- 完成弹窗超时收尾块(仅 on_fail goto 进入, 顺序流不会走到) ----------
  - name: 五环-超时收尾-关面板
    wait: {ui: 主界面}
    timeout: 5
    retry: 0
    on_success: {goto: "五环-脚本结束"}
    on_fail: continue

  # 2026-09-12 事故修复: 旧版只点一次返回+等主市面 15s×3, 今早实际停在玩法面板就放弃了。
  # 改练功区逃逸循环: 不在主界面就点左下角(面板=返回箭头/练功区=退出), 最多 6 轮
  - name: 五环-收尾逃逸循环
    loop: 6
    steps:
      - name: 五环-收尾-若在主界面则通过
        wait: {ui: 主界面}
        timeout: 3
        retry: 0
        on_success: {goto: "五环-收尾已回主界面"}
        on_fail: continue

      - name: 五环-收尾-点左下角返回
        click: [25, 922]
        on_fail: continue

      - name: 五环-收尾-停顿
        sleep: 1

  - name: 五环-收尾已回主界面
    sleep: 1

  - name: 五环-超时收尾-跳结束
    jump: 五环-脚本结束

  # ---------- 找卡恢复块(仅 on_fail goto 进入, 顺序流不会走到) ----------
  # 2026-09-11 新增: 找不到五环卡片时不许裸奔终止全家桶。
  # 拉回顶部→再点; 失败→下滑一屏→再点; 仍失败→按无法进入收尾跳下一段。
  # 2026-09-11 加固: 面板没开时(偶发点击被吞)先重开面板, 否则找卡全空转
  # 2026-10-09 修复: 本块此前是死代码(找卡的 on_fail 直接 goto 拉回顶部绕开了它)。
  #   现两条入口都先经过这里, 重开面板后补点「日常」页签再找卡。
  - name: 五环-恢复-若面板已开则直接找卡
    wait: {ui: 玩法面板}
    timeout: 3
    retry: 0
    on_success: {goto: "五环-找卡恢复-点日常页签"}
    on_fail: continue

  - name: 五环-恢复-点玩法按钮(1/2)
    click: [506, 539]

  - name: 五环-恢复-等面板出现(1/2)
    wait: {ui: 玩法面板}
    timeout: 5
    retry: 0
    on_success: {goto: "五环-找卡恢复-点日常页签"}
    on_fail: continue

  - name: 五环-恢复-点玩法按钮(2/2)
    click: [506, 539]

  - name: 五环-恢复-等面板出现(2/2)
    wait: {ui: 玩法面板}
    timeout: 5
    retry: 0
    on_success: {goto: "五环-找卡恢复-点日常页签"}
    on_fail: {goto: "五环-脚本结束"}

  # 重开面板后要先确保在「日常」页签, 否则卡片找不到(与主流程一致)
  - name: 五环-找卡恢复-点日常页签
    click: [95, 934]
    on_fail: continue

  - name: 五环-找卡恢复-页签停顿
    sleep: 1

  - name: 五环-找卡恢复-拉回顶部(1/2)
    swipe: {from: [270, 320], to: [270, 860], duration: 200}

  - name: 五环-找卡恢复-停顿1
    sleep: 1

  - name: 五环-找卡恢复-拉回顶部(2/2)
    swipe: {from: [270, 320], to: [270, 860], duration: 200}

  - name: 五环-找卡恢复-停顿2
    sleep: 1

  - name: 五环-找卡恢复-顶部再点
    click: {ocr: 五环任务}
    timeout: 8
    retry: 1
    on_fail: {goto: 五环-找卡恢复-下滑找}

  - name: 五环-找卡恢复-顶部成功跳回流程
    jump: 五环-若弹离线完成提示则点继续进行

  - name: 五环-找卡恢复-下滑找
    swipe: {from: [270, 700], to: [270, 250], duration: 300}

  - name: 五环-找卡恢复-下滑停顿
    sleep: 1

  - name: 五环-找卡恢复-下滑后再点
    click: {ocr: 五环任务}
    timeout: 8
    retry: 1
    on_fail: {goto: 五环-已完成关面板}

  - name: 五环-找卡恢复-下滑成功跳回流程
    jump: 五环-若弹离线完成提示则点继续进行

  - name: 五环-脚本结束
    sleep: 1
