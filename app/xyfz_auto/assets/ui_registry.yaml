# -*- coding: utf-8 -*-
# ============================================================
# 大话西游 主界面按钮注册表 (UI Registry)
# ------------------------------------------------------------
# 用途：脚本里用中文名引用按钮，不必写坐标。
#   wait:  {ui: 主界面}          —— 等待进入某界面
#   wait:  {visible: 角色}        —— 等待某按钮可见
#   click: {button: 角色}         —— 点击按钮(默认用 at 坐标)
#   click: {button: 角色, mode: locate} —— 先模板定位再点(界面漂移时用)
#
# 按钮字段说明：
#   desc     功能说明(人工确认后维护)
#   screen   归属界面
#   at       默认点击坐标(中心)
#   template 模板文件名(不含扩展名, 用于 visible 判断/locate 定位)
#   alias    脚本里可用的别名
#   dynamic  true=按钮内容会变化(如托管中/托管结束), 模板不可靠
#   opens    点击后进入的界面名 —— 三级/多级导航的依据:
#            goto:{ui:X} 引擎按 opens 自动推导点击路径;
#            给三级入口按钮(如 技能页签)填 opens 后即可 goto:{ui:技能页}
# ============================================================

screens:
  登录界面:
    desc: 启动游戏后的账号登录页(有"登 录"按钮)
    any_of: [login_btn]
  主界面:
    desc: 游戏主场景, 底部有 角色/召唤兽/背包/坐骑 菜单栏
    any_of: [bottom_btn_role, bottom_btn_bag, bottom_btn_mount]
    # 2026-09-23: 战斗过渡期底栏短暂可见曾被误判为主界面(域外批次死循环
    # 8h 的根因), 判主界面时必须同时不在战斗画面
    not_screens: [战斗中]
  战斗中:
    desc: 回合制战斗画面(左侧有逃跑按钮/右下自动标志)
    any_of: [battle_flag_auto, battle_btn_flee]
  主菜单面板:
    desc: 点四方格打开的功能菜单(多宝阁/商城/福利/交易行/邮件/好友等 + 底部纯享等圆钮)
    any_of: [menu_panel_back]
  玩法面板:
    desc: 点主界面"玩法"打开的日常玩法列表(地煞星/师门/修罗等卡片+底部页签)
    any_of: [panel_wanfa_title]
  角色面板:
    desc: 点底部"角色"打开的角色信息(属性/技能/作坊/七十二变)
    any_of: [panel_role_title]
  背包面板:
    desc: 点底部"背包"打开的物品栏(装备区+物品格+仓库/整理)
    any_of: [panel_bag_title]
  坐骑面板:
    desc: 点底部"坐骑"打开的坐骑管理(坐骑/座驾/飞行器)
    any_of: [panel_mount_title]
  召唤兽面板:
    desc: 点底部"召唤兽"打开的召唤兽列表(卡片+排序/仓库)
    any_of: [panel_pet_title]
  技能页:
    desc: 角色面板-技能页签(三级)：技能格+强化/转职
    any_of: [panel_skill_title]
  作坊页:
    desc: 角色面板-作坊页签(三级)：普通装备/神兵/宝石/佩饰打造
    any_of: [panel_workshop_title]
  七十二变页:
    desc: 角色面板-七十二变页签(三级)：属性卡+变身造型+五行修炼
    any_of: [panel_72_title]
  打造页:
    desc: 作坊点打造/重铸/炼化打开的四级页(标题高装升级, 底部打造/重铸/炼化子页签)
    any_of: [panel_forge_title]
  商城页:
    desc: 主菜单-商城(每日/仙玉/外观/充值礼包, 底部页签固定)
    any_of: [panel_shop_title]
  福利页:
    desc: 主菜单-福利(活动横幅列表, 右上X关闭)
    any_of: [panel_welfare_title]
  邮件页:
    desc: 主菜单-邮件(邮件列表+一键删除/一键领取)
    any_of: [panel_mail_title]
  好友页:
    desc: 主菜单-好友系统(好友列表+添加/申请)
    any_of: [panel_friend_title]
  仓库页:
    desc: 背包点"仓库"打开的仓库页(上仓库格+下我的背包/一键放入)
    any_of: [panel_warehouse_title]
  秘境寻踪页:
    desc: 玩法面板-挑战页签点"秘境寻踪"卡片进入(顶部标题"秘境寻踪"+开放/封闭秘境分组)
    any_of: [screen_mijing_title]
  魔王窟礼包弹窗:
    desc: 周常页签点右下"魔王窟礼包"浮动按钮弹出的领取弹窗(当前奖励+领取按钮)
    any_of: [screen_mowang_dlg_title]
  盈福大厅页:
    desc: 主菜单面板-盈福大厅(绑定有礼/关注有礼/其他 三区块; 签到弹窗打开时本页特征被盖住, 不会误判)
    any_of: [menu_btn_signin]
  签到福利弹窗:
    desc: 盈福大厅-每日签到弹出的签到面板(顶部"签到福利"标题 + 本月签到进度 + 月历 + 底部"签到"按钮)
    any_of: [screen_signin_title]
  帮派页:
    desc: 点主界面右下"帮派"进入(顶部标题"议政厅"/"聚义厅", 底部 议政厅/聚义厅/守护神/驯兽堂 四页签)
    any_of: [gang_title_yizhengtin, gang_title_juyiting]
  帮派聚义厅页:
    desc: 帮派页切到"聚义厅"页签(中部"捐献奖励"+材料捐献/银两捐献; 每日首次为单个"捐献"+"本次免费")
    any_of: [gang_title_juyiting]

